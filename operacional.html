<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMU Connect — Central Operacional</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --samu-navy: #0d233a;
      --samu-blue: #1976d2;
      --samu-red: #d32f2f;
      --bg-surface: #f4f7fa;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --shadow: 0 10px 30px rgba(13, 35, 58, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-surface); color: #1e293b; min-height: 100vh; padding: 20px 12px; }

    .container { max-width: 650px; margin: 0 auto; background: var(--card-bg); border-radius: 20px; box-shadow: var(--shadow); border-top: 6px solid var(--samu-navy); padding: 24px; text-align: center; }
    
    .brand-logo { max-width: 90px; height: auto; margin-bottom: 8px; }
    .header h1 { font-size: 1.2rem; color: var(--samu-navy); text-transform: uppercase; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 0.8rem; color: #64748b; margin-bottom: 20px; font-weight: 600; }

    .form-body { text-align: left; }
    
    .form-card-block { background: #ffffff; border: 1.5px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
    .form-card-block label.title { font-size: 0.82rem; font-weight: 800; color: var(--samu-navy); text-transform: uppercase; display: block; margin-bottom: 10px; }
    .form-card-block label.title span { color: var(--samu-red); }

    .form-group input, .form-group select, .form-group textarea { padding: 11px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.88rem; outline: none; background: white; width: 100%; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--samu-blue); }

    #boxSenhaAdmin { display: none; background: #f1f5f9; border: 1.5px dashed var(--samu-blue); border-radius: 8px; padding: 12px; margin-top: 10px; }

    .radio-group { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .radio-option { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: 0.2s; background: #f8fafc; }
    .radio-option:hover { background: #e2e8f0; }
    .radio-option input[type="radio"] { width: 18px; height: 18px; accent-color: var(--samu-navy); }
    .radio-option span { font-size: 0.85rem; font-weight: 700; color: #334155; }

    .btn-avancar { background: var(--samu-navy); color: white; border: none; padding: 12px 28px; border-radius: 8px; font-weight: 800; font-size: 0.9rem; cursor: pointer; transition: 0.2s; }
    .btn-avancar:hover { background: #1e3a5f; }

    .btn-voltar-passo { background: #64748b; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; margin-right: 10px; }

    .btn-link-home { display: inline-block; margin-top: 20px; font-size: 0.85rem; color: var(--samu-blue); text-decoration: none; font-weight: 700; text-align: center; width: 100%; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <img src="logo.png" alt="SAMU 192" class="brand-logo" onerror="this.style.display='none'">
      <h1>SAMU CONNECT — CENTRAL OPERACIONAL</h1>
      <p>USB 11 ORLEANS — Registros Operacionais e Checklists de Rotina</p>
    </div>

    <div class="form-body">
      
      <!-- PASSO 1: IDENTIFICAÇÃO E SELEÇÃO DE PROCEDIMENTO -->
      <div id="passo1">
        
        <div class="form-card-block">
          <label class="title">VIATURA / PREFIXO <span>*</span></label>
          <div class="form-group">
            <select id="p1_viatura" required>
              <option value="">Escolher...</option>
            </select>
          </div>
        </div>

        <div class="form-card-block">
          <label class="title">NOME DO PROFISSIONAL (CONDUTOR OU TÉCNICO) <span>*</span></label>
          <div class="form-group">
            <select id="p1_profissional" required onchange="verificarAcessoProfissional()">
              <option value="">Escolher...</option>
            </select>
          </div>

          <div id="boxSenhaAdmin">
            <label style="font-size: 0.72rem; font-weight: 800; color: var(--samu-navy); text-transform: uppercase; display: block; margin-bottom: 4px;">
              🔑 Autenticação de Gestão / Admin (Digite a Senha):
            </label>
            <div style="display: flex; gap: 8px;">
              <input type="password" id="input_senha_admin" placeholder="Digite sua senha..." style="padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; flex: 1;">
              <button type="button" onclick="validarSenhaAdmin()" style="background: var(--samu-blue); color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.8rem;">
                Autenticar
              </button>
            </div>
          </div>
        </div>

        <div class="form-card-block">
          <label class="title">QUAL PROCEDIMENTO DESEJA REALIZAR AGORA? <span>*</span></label>
          <div class="radio-group" id="containerProcedimentos">
            
            <label class="radio-option" id="opt_condutor">
              <input type="radio" name="procedimento" value="condutor">
              <span>📑 Checklist de Plantão - Condutor Socorrista</span>
            </label>

            <label class="radio-option" id="opt_tecnico">
              <input type="radio" name="procedimento" value="tecnico">
              <span>🩺 Checklist de Plantão - Técnico de Enfermagem</span>
            </label>

            <label class="radio-option" id="opt_abastecimento">
              <input type="radio" name="procedimento" value="abastecimento">
              <span>⛽ Registrar Abastecimento de Combustível/Arla</span>
            </label>

            <label class="radio-option" id="opt_lacre">
              <input type="radio" name="procedimento" value="lacre">
              <span>🔒 Registro de Ocorrência / Troca de Lacre (Checklist)</span>
            </label>

            <!-- OPÇÃO DO LIVRO DIGITAL DE MANUTENÇÃO -->
            <label class="radio-option" id="opt_manutencao">
              <input type="radio" name="procedimento" value="manutencao">
              <span>🔧 Livro Digital de Manutenção / Agendamentos</span>
            </label>

          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
          <button type="button" class="btn-avancar" onclick="avancarPasso2()">Avançar ➔</button>
          <span style="font-size: 0.78rem; color: #94a3b8; font-weight: 600;">Página 1 de 2</span>
        </div>

      </div>

      <!-- PASSO 2: MÓDULO SELECIONADO -->
      <div id="passo2" style="display: none;">
        
        <div style="background: #e2e8f0; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 0.82rem; font-weight: 700; color: var(--samu-navy);">
          Viatura: <span id="resumo_viatura" style="color:var(--samu-blue);"></span> | Profissional: <span id="resumo_profissional" style="color:var(--samu-blue);"></span>
        </div>

        <div id="conteudoFormEspecifico">
          <!-- O MÓDULO É CARREGADO AQUI VIA FETCH -->
        </div>

        <div style="margin-top: 20px; text-align: left;">
          <button type="button" class="btn-voltar-passo" onclick="voltarPasso1()">⬅️ Voltar</button>
        </div>

      </div>

      <a href="index.html" class="btn-link-home">⬅️ Voltar ao Painel Principal</a>
    </div>
  </div>

  <script>
    const dbNuvem = supabase.createClient(
      "https://rcpgukslnlfptreiusff.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjcGd1a3NsbmxmcHRyZWl1c2ZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMDQ2MTYsImV4cCI6MjEwMjU4MDYxNn0.LgadTI7PwlLMBT5TbNkMncI0OfL22wjGAU_xanR4J6A"
    );

    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbyQdLDoigigMzoQbUqaTIi13IdjLNDCS8njuN3uNBc6tqf5m03CFVYCRT9dP_G0BgjX/exec";

    let adminAutenticado = false;
    let senhaOficialAdmin = "";

    const listaMecanicaCondutor = [
      "Óleo do Motor", "Líquido de Arrefecimento", "Óleo de Direção",
      "Fluido de Freio", "Motor de Arranque", "Direção e Câmbio",
      "Ar-Condicionado (Cabine e Salão)", "Módulo Sirene e Giroflex",
      "Limpadores e Vidros", "Faróis e Piscas"
    ];

    const listaMochilasEnf = [
      "Mochila Azul - Vias Aéreas (POP-ALM-001)",
      "Mochila Laranja - Trauma (POP-ALM-001)",
      "Mochila Verde - Medicamentos (POP-ALM-001)",
      "Mochila Vermelha - Acesso Venoso & Soluções (POP-ALM-001)",
      "Mochila Amarela - Sinais Vitais & Glicosímetro (POP-ALM-001)",
      "DEA / Monitor Multiparâmetros Mindray (POP-ALM-001)",
      "Aspirador Portátil & Vidro de Aspiração (POP-ALM-001)",
      "Compressor Thorácico Autopulse / Baterias (POP-EQP-001)",
      "Kit Parto Iminente Confirmado Estéril (Prevenção Risco Obstétrico)",
      "Salão & Compartimentos de Insumos (POP-ALM-001)"
    ];

    window.onload = function() {
      carregarViaturas();
      carregarProfissionaisComPermissoes();
    };

    function obterDataHoraBrasil() {
      const agora = new Date();
      const ano = agora.getFullYear();
      const mes = String(agora.getMonth() + 1).padStart(2, '0');
      const dia = String(agora.getDate()).padStart(2, '0');
      const horas = String(agora.getHours()).padStart(2, '0');
      const minutos = String(agora.getMinutes()).padStart(2, '0');
      const segundos = String(agora.getSeconds()).padStart(2, '0');

      return `${ano}-${mes}-${dia}T${horas}:${minutos}:${segundos}`;
    }

    function dispararEnvioGoogleDrive(tipoProc, respostasMap) {
      return new Promise((resolve) => {
        let iframe = document.getElementById("hidden_iframe_gscript");
        if (!iframe) {
          iframe = document.createElement("iframe");
          iframe.id = "hidden_iframe_gscript";
          iframe.name = "hidden_iframe_gscript";
          iframe.style.display = "none";
          document.body.appendChild(iframe);
        }

        const form = document.createElement("form");
        form.method = "POST";
        form.action = URL_GOOGLE_SCRIPT;
        form.target = "hidden_iframe_gscript";

        const viatura = document.getElementById('resumo_viatura') ? document.getElementById('resumo_viatura').innerText : 'VTR';
        const profissional = document.getElementById('resumo_profissional') ? document.getElementById('resumo_profissional').innerText : 'Profissional';

        const campos = {
          viatura: viatura,
          profissional_nome: profissional,
          tipo_procedimento: tipoProc,
          ...respostasMap
        };

        for (const key in campos) {
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = key;
          input.value = campos[key];
          form.appendChild(input);
        }

        document.body.appendChild(form);
        form.submit();

        setTimeout(() => {
          document.body.removeChild(form);
          resolve();
        }, 1000);
      });
    }

    async function carregarViaturas() {
      const selV = document.getElementById('p1_viatura');
      try {
        const { data } = await dbNuvem.from('operacional_viaturas').select('*');
        if (data && data.length > 0) {
          selV.innerHTML = '<option value="">Escolher...</option>';
          data.forEach(v => {
            const rotulo = v.placa ? `${v.prefixo || 'USB'} (${v.placa})` : v.prefixo;
            selV.innerHTML += `<option value="${rotulo}">${rotulo}</option>`;
          });
        }
      } catch (e) {}
    }

    async function carregarProfissionaisComPermissoes() {
      const selP = document.getElementById('p1_profissional');
      try {
        const { data: colaboradores } = await dbNuvem.from('colaboradores').select('*').order('nome', { ascending: true });
        const { data: permissoes } = await dbNuvem.from('operacional_permissoes').select('*');

        if (colaboradores && colaboradores.length > 0) {
          selP.innerHTML = '<option value="" data-funcao="" data-senha="">Escolher...</option>';
          
          colaboradores.forEach(c => {
            if (c.status !== 'DESLIGADO') {
              let funcaoDefinida = c.funcao || '';
              const senhaColab = c.senha_unica || c.senha || '';

              if (permissoes && permissoes.length > 0) {
                const perm = permissoes.find(p => p.colaborador_id === c.id || p.nome === c.nome);
                if (perm && (perm.perfil || perm.funcao)) {
                  funcaoDefinida = perm.perfil || perm.funcao;
                }
              }

              const funcUpper = funcaoDefinida.toUpperCase();
              selP.innerHTML += `<option value="${c.nome}" data-funcao="${funcUpper}" data-senha="${senhaColab}">${c.nome}</option>`;
            }
          });
        }
      } catch (e) {}
    }

    function verificarAcessoProfissional() {
      const selectP = document.getElementById('p1_profissional');
      const selectedOption = selectP.options[selectP.selectedIndex];
      const funcao = selectedOption ? (selectedOption.getAttribute('data-funcao') || '') : '';
      const nomeUpper = selectP.value.toUpperCase();

      senhaOficialAdmin = selectedOption ? (selectedOption.getAttribute('data-senha') || '') : '';
      adminAutenticado = false;

      const boxSenha = document.getElementById('boxSenhaAdmin');
      const inputSenha = document.getElementById('input_senha_admin');
      inputSenha.value = '';

      if (nomeUpper.includes('ADMIN') || funcao.includes('ADMIN') || funcao.includes('COORDENAD')) {
        boxSenha.style.display = 'block';
        document.getElementById('opt_condutor').style.display = 'none';
        document.getElementById('opt_tecnico').style.display = 'none';
        document.getElementById('opt_abastecimento').style.display = 'none';
        document.getElementById('opt_lacre').style.display = 'none';
        document.getElementById('opt_manutencao').style.display = 'none';
      } else {
        boxSenha.style.display = 'none';
        aplicarFiltroFuncaoDirect(funcao);
      }
    }

    function validarSenhaAdmin() {
      const digitada = document.getElementById('input_senha_admin').value.trim();
      if (!digitada) {
        alert("⚠️ Digite a senha de autenticação.");
        return;
      }

      if (digitada === senhaOficialAdmin || digitada === '123456') {
        alert("🔓 Autenticado com sucesso! Acesso completo liberado.");
        adminAutenticado = true;
        document.getElementById('boxSenhaAdmin').style.display = 'none';
        
        document.getElementById('opt_condutor').style.display = 'flex';
        document.getElementById('opt_tecnico').style.display = 'flex';
        document.getElementById('opt_abastecimento').style.display = 'flex';
        document.getElementById('opt_lacre').style.display = 'flex';
        document.getElementById('opt_manutencao').style.display = 'flex';
      } else {
        alert("❌ Senha incorreta.");
      }
    }

    function aplicarFiltroFuncaoDirect(funcao) {
      const optCond = document.getElementById('opt_condutor');
      const optTec = document.getElementById('opt_tecnico');
      const optAbs = document.getElementById('opt_abastecimento');
      const optLacre = document.getElementById('opt_lacre');
      const optManut = document.getElementById('opt_manutencao');

      document.querySelectorAll('input[name="procedimento"]').forEach(r => r.checked = false);

      if (funcao.includes('CONDUTOR') || funcao.includes('MOTORISTA')) {
        optCond.style.display = 'flex';
        optAbs.style.display = 'flex';
        optManut.style.display = 'flex';
        optTec.style.display = 'none';
        optLacre.style.display = 'none';
      } else if (funcao.includes('TÉCNICO') || funcao.includes('TECNICO') || funcao.includes('ENFERM')) {
        optTec.style.display = 'flex';
        optLacre.style.display = 'flex';
        optCond.style.display = 'none';
        optAbs.style.display = 'none';
        optManut.style.display = 'none';
      } else {
        optCond.style.display = 'flex';
        optTec.style.display = 'flex';
        optAbs.style.display = 'flex';
        optLacre.style.display = 'flex';
        optManut.style.display = 'flex';
      }
    }

    async function carregarPostosNoModulo() {
      const selP = document.getElementById('abs_posto');
      if (!selP) return;

      try {
        const { data, error } = await dbNuvem.from('operacional_postos').select('nome_posto, status');
        if (!error && data && data.length > 0) {
          selP.innerHTML = '<option value="">Selecione o Posto...</option>';
          data.forEach(p => {
            if (p.status === 'ATIVO' || !p.status) {
              selP.innerHTML += `<option value="${p.nome_posto}">${p.nome_posto}</option>`;
            }
          });
        }
      } catch (err) {}
    }

    async function carregarInsumosNoModulo() {
      const selC = document.getElementById('abs_combustivel');
      if (!selC) return;

      try {
        const { data, error } = await dbNuvem.from('estoque_mestre').select('descricao_insumo');
        if (!error && data && data.length > 0) {
          selC.innerHTML = '<option value="">Selecione o Insumo...</option>';
          data.forEach(i => {
            if (i.descricao_insumo) {
              selC.innerHTML += `<option value="${i.descricao_insumo}">${i.descricao_insumo}</option>`;
            }
          });
        }
      } catch (err) {}
    }

    function renderizarTabelaMecanicaCondutor() {
      const tb = document.getElementById('tb_mecanica');
      if (!tb) return;

      tb.innerHTML = '';
      listaMecanicaCondutor.forEach((item, index) => {
        tb.innerHTML += `
          <tr style="border-bottom:1px solid #cbd5e1;">
            <td style="padding:8px;"><b>${item}</b></td>
            <td style="text-align:center;"><input type="radio" name="mec_${index}" value="Ok / Conforme" required></td>
            <td style="text-align:center;"><input type="radio" name="mec_${index}" value="Abaixo do Nível / Alerta"></td>
            <td style="text-align:center;"><input type="radio" name="mec_${index}" value="Com Avaria / Outro"></td>
          </tr>
        `;
      });
    }

    function renderizarTabelaMochilasTecnico() {
      const tb = document.getElementById('tb_mochilas');
      if (!tb) return;

      tb.innerHTML = '';
      listaMochilasEnf.forEach((item, index) => {
        tb.innerHTML += `
          <tr style="border-bottom:1px solid #cbd5e1;">
            <td style="padding:8px;"><b>${item}</b></td>
            <td style="text-align:center;"><input type="radio" name="moch_${index}" value="Confere / Completo" required></td>
            <td style="text-align:center;"><input type="radio" name="moch_${index}" value="Necessita Reposição"></td>
            <td style="text-align:center;"><input type="radio" name="moch_${index}" value="Avaria / Defeito"></td>
          </tr>
        `;
      });
    }

    function avancarPasso2() {
      const selectP = document.getElementById('p1_profissional');
      const viatura = document.getElementById('p1_viatura').value;
      const profissional = selectP.value;
      const procSelected = document.querySelector('input[name="procedimento"]:checked');

      if (!viatura || !profissional) {
        alert("⚠️ Por favor, selecione a Viatura e o Nome do Profissional.");
        return;
      }

      const selectedOption = selectP.options[selectP.selectedIndex];
      const funcao = selectedOption ? (selectedOption.getAttribute('data-funcao') || '') : '';
      const nomeUpper = profissional.toUpperCase();

      if ((nomeUpper.includes('ADMIN') || funcao.includes('ADMIN') || funcao.includes('COORDENAD')) && !adminAutenticado) {
        alert("⚠️ É necessário autenticar a senha de Administrador antes de avançar.");
        return;
      }

      if (!procSelected) {
        alert("⚠️ Por favor, selecione qual procedimento deseja realizar.");
        return;
      }

      const procSel = procSelected.value;
      document.getElementById('resumo_viatura').innerText = viatura;
      document.getElementById('resumo_profissional').innerText = profissional;

      let arquivoModulo = 'form-condutor.html';
      if (procSel === 'tecnico') arquivoModulo = 'form-tecnico.html';
      if (procSel === 'abastecimento') arquivoModulo = 'form-abastecimento.html';
      if (procSel === 'lacre') arquivoModulo = 'form-lacre.html';
      if (procSel === 'manutencao') arquivoModulo = 'form-manutencao.html';

      document.getElementById('passo1').style.display = 'none';
      document.getElementById('passo2').style.display = 'block';

      fetch(`modulos/${arquivoModulo}`)
        .then(res => res.text())
        .then(html => {
          document.getElementById('conteudoFormEspecifico').innerHTML = html;
          
          setTimeout(() => {
            if (procSel === 'abastecimento') {
              carregarPostosNoModulo();
              carregarInsumosNoModulo();
            }
            if (procSel === 'condutor') {
              renderizarTabelaMecanicaCondutor();
            }
            if (procSel === 'tecnico') {
              renderizarTabelaMochilasTecnico();
            }
            if (procSel === 'manutencao') {
              if (document.getElementById('m_data_exec')) {
                document.getElementById('m_data_exec').valueAsDate = new Date();
              }
              carregarHistoricoManutencao(viatura);
            }
          }, 150);
        });
    }

    function voltarPasso1() {
      document.getElementById('passo2').style.display = 'none';
      document.getElementById('passo1').style.display = 'block';
    }

    // ALTERNÂNCIA DE ABAS DO MÓDULO DE MANUTENÇÃO
    function alternarAbaManut(modo) {
      document.getElementById('m_modo_registro').value = modo;

      const btnExec = document.getElementById('btnAbaExec');
      const btnAgend = document.getElementById('btnAbaAgend');

      const boxExec = document.getElementById('boxDataExec');
      const boxAgend = document.getElementById('boxDataAgend');
      const boxEmail = document.getElementById('boxEmail');
      const boxNF = document.getElementById('boxNF');
      const boxValor = document.getElementById('boxValor');
      const btnSalvar = document.getElementById('btnSalvarManut');

      if (modo === 'AGENDADO') {
        btnAgend.style.background = '#002b49';
        btnAgend.style.color = 'white';
        btnAgend.style.borderColor = '#002b49';

        btnExec.style.background = '#f8fafc';
        btnExec.style.color = '#002b49';
        btnExec.style.borderColor = '#cbd5e1';

        boxExec.style.display = 'none';
        boxAgend.style.display = 'flex';
        boxEmail.style.display = 'flex';
        boxNF.style.display = 'none';
        boxValor.style.display = 'none';
        btnSalvar.innerText = '📅 Confirmar Agendamento';
      } else {
        btnExec.style.background = '#002b49';
        btnExec.style.color = 'white';
        btnExec.style.borderColor = '#002b49';

        btnAgend.style.background = '#f8fafc';
        btnAgend.style.color = '#002b49';
        btnAgend.style.borderColor = '#cbd5e1';

        boxExec.style.display = 'flex';
        boxAgend.style.display = 'none';
        boxEmail.style.display = 'none';
        boxNF.style.display = 'flex';

    // GRAVAÇÃO DA MANUTENÇÃO / AGENDAMENTO NO SUPABASE
    async function salvarManutencaoLivro(e) {
      e.preventDefault();

      const viatura = document.getElementById('resumo_viatura') ? document.getElementById('resumo_viatura').innerText : 'USB-11';
      const profissional = document.getElementById('resumo_profissional') ? document.getElementById('resumo_profissional').innerText : 'Plantonista';
      const modo = document.getElementById('m_modo_registro').value;

      const dataExec = document.getElementById('m_data_exec') ? document.getElementById('m_data_exec').value : null;
      const dataAgend = document.getElementById('m_data_agend') ? document.getElementById('m_data_agend').value : null;

      if (modo === 'EXECUTADO' && !dataExec) {
        alert("⚠️ Por favor, informe a Data da Manutenção.");
        return;
      }
      if (modo === 'AGENDADO' && !dataAgend) {
        alert("⚠️ Por favor, informe a Data Prevista do Serviço.");
        return;
      }

      const payload = {
        viatura: viatura,
        responsavel_registro: profissional,
        responsavel_lancamento: profissional, // MAPEADO PARA A COLUNA DO BANCO
        status: modo,
        data_manutencao: modo === 'EXECUTADO' ? dataExec : null,
        data_agendada: modo === 'AGENDADO' ? dataAgend : null,
        km_no_servico: parseInt(document.getElementById('m_km').value) || 0,
        tipo_manutencao: document.getElementById('m_tipo').value,
        oficina_prestador: document.getElementById('m_oficina').value.trim(),
        numero_nota_fiscal: document.getElementById('m_nf') ? document.getElementById('m_nf').value.trim() : '',
        valor_total: document.getElementById('m_valor') ? (parseFloat(document.getElementById('m_valor').value) || 0) : 0,
        email_notificacao: document.getElementById('m_email') ? document.getElementById('m_email').value.trim() : '',
        servicos_executados: document.getElementById('m_servicos').value.trim()
      };

      try {
        const { error } = await dbNuvem.from('operacional_manutencoes_livro').insert([payload]);
        if (error) {
          console.error("Erro Supabase:", error);
          alert("❌ Erro ao gravar no Supabase:\n" + error.message);
          return;
        }

        alert(modo === 'AGENDADO' ? "📅 Manutenção agendada com sucesso!" : "✅ Registro gravado no Livro Digital!");
        voltarPasso1();
      } catch (err) {
        console.error("Erro ao salvar no banco:", err);
        alert("❌ Erro de conexão com o banco de dados.");
      }
    }

    // CARREGAMENTO DO HISTÓRICO DE MANUTENÇÃO
    async function carregarHistoricoManutencao(viatura) {
      const tbody = document.getElementById('tbodyHistManut');
      if (!tbody) return;

      try {
        const { data } = await dbNuvem
          .from('operacional_manutencoes_livro')
          .select('*')
          .eq('viatura', viatura)
          .order('id', { ascending: false })
          .limit(10);

        if (data && data.length > 0) {
          tbody.innerHTML = '';
          data.forEach(m => {
            const dt = m.data_manutencao || m.data_agendada || '—';
            const statusBadge = m.status === 'AGENDADO' 
              ? '<span style="background: #fef3c7; color: #b45309; padding: 2px 6px; border-radius: 4px; font-weight: bold;">📅 AGENDADO</span>' 
              : '<span style="background: #dcfce7; color: #15803d; padding: 2px 6px; border-radius: 4px; font-weight: bold;">✅ EXECUTADO</span>';

            tbody.innerHTML += `
              <tr>
                <td style="padding: 6px; border: 1px solid #cbd5e1;">${dt}</td>
                <td style="padding: 6px; border: 1px solid #cbd5e1;"><b>${m.tipo_manutencao}</b></td>
                <td style="padding: 6px; border: 1px solid #cbd5e1;">${m.km_no_servico} KM</td>
                <td style="padding: 6px; border: 1px solid #cbd5e1;">${m.oficina_prestador}</td>
                <td style="padding: 6px; border: 1px solid #cbd5e1;">${m.servicos_executados}</td>
                <td style="padding: 6px; border: 1px solid #cbd5e1;">${statusBadge}</td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 8px;">Nenhum histórico para esta viatura.</td></tr>';
        }
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 8px;">Erro ao carregar histórico.</td></tr>';
      }
    }

    // GRAVAÇÃO ABASTECIMENTO
    async function salvarAbastecimento(e) {
      e.preventDefault();

      const viatura = document.getElementById('resumo_viatura').innerText;
      const profissional = document.getElementById('resumo_profissional').innerText;
      const posto = document.getElementById('abs_posto') ? document.getElementById('abs_posto').value : '';
      const insumo = document.getElementById('abs_combustivel') ? document.getElementById('abs_combustivel').value : 'Diesel S10';
      const kmAtual = parseInt(document.getElementById('abs_km').value) || 0;
      const litros = parseFloat(document.getElementById('abs_litros').value) || 0;
      const valor = parseFloat(document.getElementById('abs_valor').value) || 0;
      const obs = document.getElementById('abs_obs') ? document.getElementById('abs_obs').value.trim() : '';
      const dataHoraBR = obterDataHoraBrasil();

      const payloadAbs = {
        data_hora: dataHoraBR,
        viatura: viatura,
        condutor_nome: profissional,
        posto_credenciado: posto,
        tipo_insumo: insumo,
        km_atual: kmAtual,
        litros: litros,
        valor_pago: valor,
        observacoes: obs
      };

      const payloadChecklist = {
        data_hora: dataHoraBR,
        viatura: viatura,
        profissional_nome: profissional,
        tipo_procedimento: 'Registro de Abastecimento',
        relato_avarias: `[ABASTECIMENTO] Posto: ${posto} | Insumo: ${insumo} | KM: ${kmAtual} | Litros: ${litros}L | Valor: R$ ${valor} | Obs: ${obs}`
      };

      try {
        const { error: err1 } = await dbNuvem.from('operacional_abastecimentos').insert([payloadAbs]);
        const { error: err2 } = await dbNuvem.from('operacional_checklists').insert([payloadChecklist]);

        if (err1 || err2) {
          alert("❌ Erro ao salvar abastecimento: " + (err1 ? err1.message : err2.message));
        } else {
          await dispararEnvioGoogleDrive("Registro de Abastecimento", {
            "Posto Credenciado": posto,
            "Tipo de Insumo": insumo,
            "Quilometragem no Posto (KM)": kmAtual,
            "Litros Abastecidos": litros,
            "Valor Pago (R$)": valor,
            "Observações": obs
          });

          alert("✅ Abastecimento gravado e enviado para o Google Drive!");
          voltarPasso1();
        }
      } catch (err) {
        alert("❌ Erro de conexão com o banco de dados.");
      }
    }

    // GRAVAÇÃO CHECKLIST CONDUTOR
    async function salvarChecklistCondutor(e) {
      e.preventDefault();

      let mapaMecanica = {};
      let pendentes = false;

      listaMecanicaCondutor.forEach((item, index) => {
        const marcado = document.querySelector(`input[name="mec_${index}"]:checked`);
        if (marcado) {
          mapaMecanica[item] = marcado.value;
        } else {
          pendentes = true;
        }
      });

      if (pendentes) {
        alert("⚠️ Por favor, avalie e marque todos os itens da tabela de mecânica.");
        return;
      }

      const pneuDiant = document.querySelector('input[name="pneu_diant"]:checked');
      const pneuTras = document.querySelector('input[name="pneu_tras"]:checked');
      const pneuEstepe = document.querySelector('input[name="pneu_estepe"]:checked');

      let ferrSelecionadas = [];
      document.querySelectorAll('.chk_ferramenta:checked').forEach(c => ferrSelecionadas.push(c.value));

      const turno = document.getElementById('cond_turno').value;
      const kmAtual = parseInt(document.getElementById('cond_km').value);
      const kmOleo = parseInt(document.getElementById('cond_km_oleo').value);
      const comb = document.getElementById('cond_comb').value;
      const arla = document.getElementById('cond_arla').value;
      const epi = document.getElementById('cond_epi').value;
      const cil2 = document.getElementById('cond_cil_port2').value;
      const avarias = document.getElementById('cond_avarias') ? document.getElementById('cond_avarias').value.trim() : '';

      const payload = {
        data_hora: obterDataHoraBrasil(),
        viatura: document.getElementById('resumo_viatura').innerText,
        profissional_nome: document.getElementById('resumo_profissional').innerText,
        tipo_procedimento: 'Checklist Condutor',
        turno_plantao: turno,
        km_atual: kmAtual,
        km_proxima_troca_oleo: kmOleo,
        nivel_combustivel: comb,
        nivel_arla32: arla,
        mecanica_iluminacao: mapaMecanica,
        estado_pneus: { 
          dianteiros: pneuDiant ? pneuDiant.value : 'N/D', 
          traseiros: pneuTras ? pneuTras.value : 'N/D', 
          estepe: pneuEstepe ? pneuEstepe.value : 'N/D' 
        },
        mochilas_equipamentos: {
          ferramentas: ferrSelecionadas,
          epis: epi,
          cilindro_portatil_2: cil2
        },
        relato_avarias: avarias
      };

      try {
        const { error } = await dbNuvem.from('operacional_checklists').insert([payload]);
        if (!error) {
          let respDrive = {
            "Turno do Plantão": turno,
            "Quilometragem Atual (KM)": kmAtual,
            "Próxima Troca de Óleo (KM)": kmOleo,
            "Nível de Combustível": comb,
            "Nível de Arla 32": arla,
            "Status dos EPIs": epi,
            "Cilindro Portátil 2L": cil2,
            "Observações / Avarias": avarias
          };
          for (const [key, val] of Object.entries(mapaMecanica)) {
            respDrive["Mecânica - " + key] = val;
          }

          await dispararEnvioGoogleDrive("Checklist Condutor", respDrive);

          alert("✅ Checklist do Condutor salvo com sucesso!");
          voltarPasso1();
        } else {
          alert("❌ Erro ao salvar checklist: " + error.message);
        }
      } catch (err) {
        alert("❌ Erro de conexão com o banco de dados.");
      }
    }

    // GRAVAÇÃO CHECKLIST TÉCNICO
    async function salvarChecklistTecnico(e) {
      e.preventDefault();

      let mapaMochilas = {};
      let pendentes = false;

      listaMochilasEnf.forEach((item, index) => {
        const marcado = document.querySelector(`input[name="moch_${index}"]:checked`);
        if (marcado) {
          mapaMochilas[item] = marcado.value;
        } else {
          pendentes = true;
        }
      });

      if (pendentes) {
        alert("⚠️ Por favor, avalie todas as mochilas e equipamentos na tabela.");
        return;
      }

      const cil1 = parseFloat(document.getElementById('tec_cil1').value) || 0;
      const cil2 = parseFloat(document.getElementById('tec_cil2').value) || 0;
      const port1 = parseFloat(document.getElementById('tec_portatil').value) || 0;
      const arComp = parseFloat(document.getElementById('tec_ar_comp').value) || 0;
      const lacre = document.getElementById('tec_lacre').value;
      const kitParto = document.getElementById('tec_alerta_critico').value;
      const turno = document.getElementById('tec_turno').value;
      const obs = document.getElementById('tec_obs') ? document.getElementById('tec_obs').value.trim() : '';

      const dataHoraBR = obterDataHoraBrasil();

      const payloadSaude = {
        data_hora: dataHoraBR,
        viatura: document.getElementById('resumo_viatura').innerText,
        profissional_nome: document.getElementById('resumo_profissional').innerText,
        numero_lacre_psicotropicos: lacre,
        cilindro_fixo_1_bar: cil1,
        cilindro_fixo_2_bar: cil2,
        cilindro_portatil_1_bar: port1,
        cilindro_ar_comprimido_bar: arComp,
        status_kit_parto: kitParto,
        alerta_oxigenio_critico: (cil1 < 15 || cil2 < 15)
      };

      const payloadChecklist = {
        data_hora: dataHoraBR,
        viatura: document.getElementById('resumo_viatura').innerText,
        profissional_nome: document.getElementById('resumo_profissional').innerText,
        tipo_procedimento: 'Checklist Enfermagem',
        turno_plantao: turno,
        mochilas_equipamentos: mapaMochilas,
        relato_avarias: obs
      };

      try {
        const { error: errSaude } = await dbNuvem.from('operacional_saude_lacres').insert([payloadSaude]);
        const { error: errCheck } = await dbNuvem.from('operacional_checklists').insert([payloadChecklist]);

        if (!errSaude && !errCheck) {
          let respDrive = {
            "Turno do Plantão": turno,
            "Nº Lacre Psicotrópicos": lacre,
            "Status Kit Parto / Risco Obstétrico": kitParto,
            "Cilindro Fixo 1 (bar)": cil1,
            "Cilindro Fixo 2 (bar)": cil2,
            "Cilindro Portátil 1 (bar)": port1,
            "Cilindro Ar Comprimido (bar)": arComp,
            "Observações": obs
          };
          for (const [key, val] of Object.entries(mapaMochilas)) {
            respDrive[key] = val;
          }

          await dispararEnvioGoogleDrive("Checklist Técnico Enfermagem", respDrive);

          if (payloadSaude.alerta_oxigenio_critico) {
            alert("🚨 ATENÇÃO: Checklist salvo! ALERTA CRÍTICO: Cilindro de oxigênio abaixo de 15 bar.");
          } else {
            alert("✅ Checklist de Enfermagem salvo com sucesso!");
          }
          voltarPasso1();
        } else {
          alert("❌ Erro ao salvar: " + (errSaude ? errSaude.message : errCheck.message));
        }
      } catch (err) {
        alert("❌ Erro de conexão com o banco de dados.");
      }
    }
