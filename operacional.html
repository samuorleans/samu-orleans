<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMU Connect — Central Operacional</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --samu-navy: #0d233a;
      --samu-blue: #1976d2;
      --bg-surface: #f4f7fa;
      --card-bg: #ffffff;
      --border: #cbd5e1;
      --shadow: 0 10px 30px rgba(13, 35, 58, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-surface); color: #1e293b; min-height: 100vh; padding: 20px 12px; }

    .container { max-width: 750px; margin: 0 auto; background: var(--card-bg); border-radius: 20px; box-shadow: var(--shadow); border-top: 6px solid var(--samu-navy); padding: 24px; text-align: center; }
    
    .brand-logo { width: 50px; height: auto; margin-bottom: 6px; }
    .header h1 { font-size: 1.2rem; color: var(--samu-navy); text-transform: uppercase; font-weight: 800; margin-bottom: 4px; }
    .header p { font-size: 0.8rem; color: #64748b; margin-bottom: 20px; font-weight: 600; }

    /* SELETOR DE PERFIL DE ACESSO OPERACIONAL */
    .perfil-bar { background: #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .perfil-bar label { font-size: 0.78rem; font-weight: 800; color: var(--samu-navy); text-transform: uppercase; }
    .perfil-bar select { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); font-weight: 700; font-size: 0.82rem; outline: none; background: white; }

    /* NAVEGAÇÃO ENTRE MÓDULOS DE CHECKLIST */
    .nav-tabs { display: flex; gap: 8px; border-bottom: 2px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; overflow-x: auto; }
    .tab-btn { padding: 10px 14px; border: none; background: #cbd5e1; font-weight: 700; font-size: 0.82rem; border-radius: 8px; cursor: pointer; color: #475569; white-space: nowrap; transition: 0.2s; }
    .tab-btn.active { background: var(--samu-navy); color: white; }
    .tab-btn.disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-voltar { display: inline-block; margin-top: 20px; font-size: 0.85rem; color: var(--samu-blue); text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Star_of_life_caucasia.svg" alt="SAMU 192" class="brand-logo">
      <h1>SAMU CONNECT — CENTRAL OPERACIONAL</h1>
      <p>USB 11 ORLEANS — Registros Operacionais e Checklists de Rotina</p>
    </div>

    <!-- CONTROLE DE ACESSO E PERMISSÃO POR FUNÇÃO -->
    <div class="perfil-bar">
      <label>⚙️ Perfil / Função em Operação:</label>
      <select id="seletorFuncaoPerfil" onchange="aplicarPermissoesPerfil()">
        <option value="TODOS">🔓 Acesso Livre (Coordenador / Admin)</option>
        <option value="CONDUTOR">🚚 Condutor Socorrista</option>
        <option value="ENFERMAGEM">🩺 Técnico / Enfermeiro Socorrista</option>
      </select>
    </div>

    <!-- ABAS OPERACIONAIS COM HABILITAÇÃO DINÂMICA -->
    <div class="nav-tabs">
      <button class="tab-btn active" id="tabAbs" onclick="mudarAba('form-abastecimento.html', 'tabAbs')">⛽ Abastecimento</button>
      <button class="tab-btn" id="tabLacres" onclick="mudarAba('form-lacre.html', 'tabLacres')">🔒 Checklist & Lacres</button>
      <button class="tab-btn" id="tabCondutor" onclick="mudarAba('form-condutor.html', 'tabCondutor')">🚑 Conferência Condutor</button>
      <button class="tab-btn" id="tabTecnico" onclick="mudarAba('form-tecnico.html', 'tabTecnico')">🩺 Conferência Enfermagem</button>
    </div>

    <!-- RECEPTÁCULO DO FORMULÁRIO ATIVO -->
    <div id="conteudoModulo">
      <p style="color:#64748b; font-size:0.85rem;">Carregando checklist operacional...</p>
    </div>

    <a href="index.html" class="btn-voltar">⬅️ Voltar ao Painel Principal</a>
  </div>

  <script>
    // Conexão oficial com o Supabase
    const dbNuvem = supabase.createClient(
      "https://rcpgukslnlfptreiusff.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjcGd1a3NsbmxmcHRyZWl1c2ZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMDQ2MTYsImV4cCI6MjEwMjU4MDYxNn0.LgadTI7PwlLMBT5TbNkMncI0OfL22wjGAU_xanR4J6A"
    );

    let abaAtualArquivo = 'form-abastecimento.html';
    let abaAtualTabId = 'tabAbs';

    window.onload = function() {
      carregarModulo(abaAtualArquivo, abaAtualTabId);
    };

    // CONTROLE DE NAVEGAÇÃO COM CHECAGEM DE PERMISSÃO
    function mudarAba(arquivoHtml, tabId) {
      const btn = document.getElementById(tabId);
      if (btn.classList.contains('disabled')) {
        alert("🔒 Esta funcionalidade não está disponível para o perfil selecionado.");
        return;
      }
      abaAtualArquivo = arquivoHtml;
      abaAtualTabId = tabId;
      carregarModulo(arquivoHtml, tabId);
    }

    // CARREGAMENTO DO MÓDULO DA PASTA MODULOS/
    function carregarModulo(arquivoHtml, tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');

      document.getElementById('conteudoModulo').innerHTML = '<p style="color:#64748b; font-size:0.85rem;">Carregando formulário...</p>';

      fetch(`modulos/${arquivoHtml}`)
        .then(res => res.text())
        .then(html => {
          document.getElementById('conteudoModulo').innerHTML = html;
          
          setTimeout(() => {
            if (typeof carregarViaturas === 'function') carregarViaturas();
            if (typeof carregarCondutores === 'function') carregarCondutores();
            if (typeof carregarPostos === 'function') carregarPostos();
          }, 200);
        })
        .catch(err => {
          document.getElementById('conteudoModulo').innerHTML = '<p style="color:red;">Erro ao carregar o formulário operacional.</p>';
        });
    }

    // HABILITA / DESABILITA ABAS DE ACORDO COM A FUNÇÃO
    function aplicarPermissoesPerfil() {
      const perfil = document.getElementById('seletorFuncaoPerfil').value;

      const btnAbs = document.getElementById('tabAbs');
      const btnLacres = document.getElementById('tabLacres');
      const btnCondutor = document.getElementById('tabCondutor');
      const btnTecnico = document.getElementById('tabTecnico');

      // Reseta bloqueios
      [btnAbs, btnLacres, btnCondutor, btnTecnico].forEach(b => b.classList.remove('disabled'));

      if (perfil === 'CONDUTOR') {
        btnTecnico.classList.add('disabled');
        if (abaAtualTabId === 'tabTecnico') mudarAba('form-condutor.html', 'tabCondutor');
      } else if (perfil === 'ENFERMAGEM') {
        btnAbs.classList.add('disabled');
        btnCondutor.classList.add('disabled');
        if (abaAtualTabId === 'tabAbs' || abaAtualTabId === 'tabCondutor') mudarAba('form-tecnico.html', 'tabTecnico');
      }
    }

    // ============================================================================
    // CONSULTAS BANCO DE DADOS SUPABASE
    // ============================================================================
    async function carregarViaturas() {
      const selV = document.getElementById('abs_viatura');
      if (!selV) return;
      try {
        const { data } = await dbNuvem.from('operacional_viaturas').select('*');
        if (data && data.length > 0) {
          selV.innerHTML = '<option value="">Selecione a Viatura...</option>';
          data.forEach(v => {
            const label = v.placa ? `${v.prefixo || 'USB'} (${v.placa})` : v.prefixo;
            selV.innerHTML += `<option value="${label}">${label}</option>`;
          });
        }
      } catch (e) {}
    }

    async function carregarCondutores() {
      const selC = document.getElementById('abs_condutor');
      if (!selC) return;
      try {
        const { data } = await dbNuvem.from('colaboradores').select('nome, funcao, status').order('nome', { ascending: true });
        if (data && data.length > 0) {
          selC.innerHTML = '<option value="">Selecione o Condutor...</option>';
          data.forEach(c => {
            const f = (c.funcao || '').toUpperCase();
            if (c.status !== 'DESLIGADO' && (f.includes('CONDUTOR') || f.includes('MOTORISTA') || f.includes('ADMIN'))) {
              selC.innerHTML += `<option value="${c.nome}">${c.nome}</option>`;
            }
          });
        }
      } catch (e) {}
    }

    async function carregarPostos() {
      const selP = document.getElementById('abs_posto');
      if (!selP) return;
      try {
        const { data } = await dbNuvem.from('operacional_postos').select('nome_posto, status').eq('status', 'ATIVO');
        if (data && data.length > 0) {
          selP.innerHTML = '<option value="">Selecione o Posto...</option>';
          data.forEach(p => {
            selP.innerHTML += `<option value="${p.nome_posto}">${p.nome_posto}</option>`;
          });
        }
      } catch (e) {}
    }

    // GRAVAÇÃO DO ABASTECIMENTO NO SUPABASE
    async function salvarAbastecimento(e) {
      e.preventDefault();
      const payload = {
        viatura: document.getElementById('abs_viatura').value,
        condutor_nome: document.getElementById('abs_condutor').value,
        posto_credenciado: document.getElementById('abs_posto').value,
        tipo_insumo: document.getElementById('abs_combustivel').value,
        km_atual: parseInt(document.getElementById('abs_km').value),
        litros: parseFloat(document.getElementById('abs_litros').value),
        valor_pago: parseFloat(document.getElementById('abs_valor').value),
        observacoes: document.getElementById('abs_obs').value.trim()
      };

      try {
        const { error } = await dbNuvem.from('operacional_abastecimentos').insert([payload]);
        if (error) {
          alert("❌ Erro ao salvar: " + error.message);
        } else {
          alert("✅ Abastecimento gravado com sucesso no Supabase!");
          document.getElementById('formAbastecimento').reset();
        }
      } catch (err) {
        alert("❌ Erro de conexão com o banco.");
      }
    }
  </script>
</body>
</html>
