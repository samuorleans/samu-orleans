<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMU Connect — Nova Senha</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --samu-red: #d32f2f;
      --samu-navy: #0d233a;
      --samu-blue: #1976d2;
      --bg-surface: #f4f7fa;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --border: #cbd5e1;
      --shadow: 0 10px 30px rgba(13, 35, 58, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg-surface); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    .card {
      width: 100%; max-width: 420px; background: var(--card-bg); border-radius: 20px;
      box-shadow: var(--shadow); border-top: 6px solid var(--samu-navy); padding: 35px 28px; text-align: center;
    }

    .card h1 { font-size: 1.25rem; color: var(--samu-navy); font-weight: 800; text-transform: uppercase; margin-bottom: 6px; }
    .card p { font-size: 0.82rem; color: #64748b; margin-bottom: 25px; }

    .form-group { display: flex; flex-direction: column; text-align: left; margin-bottom: 18px; }
    .form-group label { font-size: 0.78rem; font-weight: 700; color: var(--samu-navy); margin-bottom: 6px; text-transform: uppercase; }
    .form-group input { padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 0.9rem; outline: none; background: #f8fafc; }

    .btn-submit { width: 100%; background: #15803d; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; }
    .btn-submit:hover { background: #166534; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🔒 DEFINIR NOVA SENHA</h1>
    <p>Crie uma nova senha de acesso segura para o seu perfil no SAMU Connect.</p>

    <form id="formNovaSenha" onsubmit="atualizarSenha(event)">
      <div class="form-group">
        <label>Nova Senha:*</label>
        <input type="password" id="nova_senha" placeholder="Mínimo 6 caracteres" minlength="6" required>
      </div>

      <div class="form-group">
        <label>Confirme a Nova Senha:*</label>
        <input type="password" id="confirma_senha" placeholder="Digite novamente..." minlength="6" required>
      </div>

      <button type="submit" class="btn-submit">💾 Salvar Nova Senha</button>
    </form>
  </div>

  <script>
    const dbNuvem = supabase.createClient(
      "https://rcpgukslnlfptreiusff.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjcGd1a3NsbmxmcHRyZWl1c2ZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMDQ2MTYsImV4cCI6MjEwMjU4MDYxNn0.LgadTI7PwlLMBT5TbNkMncI0OfL22wjGAU_xanR4J6A"
    );

    async function atualizarSenha(e) {
      e.preventDefault();
      const s1 = document.getElementById('nova_senha').value;
      const s2 = document.getElementById('confirma_senha').value;

      if (s1 !== s2) {
        alert("⚠️ As senhas digitadas não coincidem. Digite novamente."); return;
      }

      const { error } = await dbNuvem.auth.updateUser({ password: s1 });

      if (!error) {
        alert("✅ Senha alterada com sucesso! Você será redirecionado para a tela de login.");
        window.location.href = 'index.html';
      } else {
        alert("Erro ao alterar senha: " + error.message);
      }
    }
  </script>
</body>
</html>
