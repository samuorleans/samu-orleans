<div class="manut-container" style="background: white; border-radius: 12px; padding: 15px; border-top: 4px solid #002b49;">
  <div style="text-align: center; margin-bottom: 15px; border-bottom: 2px solid #cbd5e1; padding-bottom: 10px;">
    <h2 style="color: #002b49; font-size: 1.2rem; font-weight: 800;">🔧 Livro Digital de Manutenção da Viatura</h2>
    <p style="font-size: 0.8rem; color: #666;">Registro de serviços executados e agendamento preventivo</p>
  </div>

  <!-- SELETOR DE MODO (ABAS) -->
  <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
    <button type="button" id="btnAbaExec" onclick="alternarAbaManut('EXECUTADO')" style="flex: 1; min-width: 180px; padding: 12px; border: 2px solid #002b49; background: #002b49; color: white; border-radius: 8px; font-weight: 700; cursor: pointer;">
      ✅ Registro de Serviço Executado
    </button>
    <button type="button" id="btnAbaAgend" onclick="alternarAbaManut('AGENDADO')" style="flex: 1; min-width: 180px; padding: 12px; border: 2px solid #cbd5e1; background: #f8fafc; color: #002b49; border-radius: 8px; font-weight: 700; cursor: pointer;">
      📅 Agendar Manutenção / Lembrete
    </button>
  </div>

  <form id="formManutAcao" onsubmit="salvarManutencaoLivro(event)">
    <input type="hidden" id="m_modo_registro" value="EXECUTADO">

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; text-align: left;">
      
      <!-- SELEÇÃO DE VIATURA -->
      <div style="display: flex; flex-direction: column;">
        <label style="font-size: 0.75rem; font-weight: 700; color: #002b49; margin-bottom: 4px;">VIATURA / AMBULÂNCIA:*</label>
        <select id="m_viatura_id" required style="padding: 9px; border: 1.5px solid #cbd5e1; border-radius: 8px; outline: none; width: 100%; font-weight: 600;" onchange="carregarHistoricoManutencao()">
          <option value="">Consultando viaturas...</option>
        </select>
      </div>

      <!-- DATA EXECUÇÃO -->
      <div id="boxDataExec" style="display: flex; flex-direction: column;">
        <label style="font-size: 0.75rem; font-weight: 700; color: #002b49; margin-bottom: 4px;">DATA DA MANUTENÇÃO:*</label>
        <input type="date" id="m_data_exec" style="padding: 9px; border: 1.5px solid #cbd5e1; border-radius: 8px; outline: none; width: 100%;">
      </div>

      <!-- DATA AGENDADA -->
      <div id="boxDataAgend" style="display: none; flex-direction: column;">
        <label style="font-size: 0.75rem; font-weight: 700; color: #002b49; margin-bottom: 4px;">DATA PREVISTA DO SERVIÇO:*</label>
        <input type="date" id="m_data_agend" style="padding: 9px; border: 1.5px solid #cbd5e1; border-radius: 8px; outline: none; width: 100%;">
      </div>

      <!-- KM ATUAL -->
      <div style="display: flex; flex-direction: column;">
        <label style="font-size: 0.75rem; font-weight: 700; color: #002b49; margin-bottom: 4px;">KM ATUAL DA VIATURA:*</label>
        <input type="number" id="m_km" placeholder="Ex: 145200" required style="padding: 9px; border: 1.5px solid #cbd5e1; border-radius: 8px; outline: none; width: 100%;">
      </div>

      <!-- TIPO DE MANUTENÇÃO -->
      <div style="display: flex; flex-direction: column;">
        <label style="font-size: 0.75rem; font-weight: 700; color: #002b49; margin-bottom: 4px;">TIPO DE MANUTENÇÃO:*</label>
        <select id="m_tipo" required style="padding: 9px; border: 1.5px solid #cbd5e1; border-radius: 8px; outline: none; width: 100%;">
          <option value="PREVENTIVA">Preventiva (Óleo, Filtros, Revisão)</option>
          <option value="CORRETIVA">Corretiva (Quebra/Defeito urgente)</option>
          <option value="PNEUS">Troca/Rodízio/Geometria de Pneus</option>
          <option value="ELETRICA">Elétrica / Sinalizador / Sirene</option>
          <option value="FREIOS">Sistema de Freios / Pastilhas</option>
          <option value="LAVAGEM">Higienização Completa / Lavagem</option>
        </select>
      </div>

      <!-- SELEÇÃO DE OFICINA VINCULADA -->
      <div style="display: flex; flex-direction: column;">
        <label style="font-size: 0.75rem; font-weight: 700; color: #002b49; margin-bottom: 4px;">OFICINA / PRESTADOR:*</label>
        <select id="m_oficina_id" required style="padding: 9px; border: 1.5px solid #cbd5e1; border-radius: 8px; outline: none; width: 100%; font-weight: 600;">
          <option value="">Consultando oficinas ativas...</option>
        </select>
      </div>

      <!-- RESPONSÁVEL PELO REGISTRO -->
      <div style="display: flex; flex-direction: column;">
        <label style="font-size: 0.75rem; font-weight: 700; color: #002b49; margin-bottom: 4px;">CONDUTOR / RESPONSÁVEL:*</label>
        <select id="m_colaborador_id" required style="padding: 9px; border: 1.5px solid #cbd5e1; border-radius: 8px; outline: none; width: 100%;">
          <option value="">Consultando servidores...</option>
        </select>
      </div>

      <div id="boxNF" style="display: flex; flex-direction: column;">
        <label style="font-size: 0.75rem; font-weight: 700; color: #002b49; margin-bottom: 4px;">Nº NOTA FISCAL / OS:</label>
        <input type="text" id="m_nf" placeholder="Ex: NF-1042" style="padding: 9px; border: 1.5px solid #cbd5e1; border-radius: 8px; outline: none; width: 100%;">
      </div>

      <div id="boxValor" style="display: flex; flex-direction: column;">
        <label style="font-size: 0.75rem; font-weight: 700; color: #002b49; margin-bottom: 4px;">VALOR TOTAL (R$):</label>
        <input type="number" step="0.01" id="m_valor" placeholder="0,00" style="padding: 9px; border: 1.5px solid #cbd5e1; border-radius: 8px; outline: none; width: 100%;">
      </div>

      <div id="boxEmail" style="display: none; flex-direction: column; grid-column: span 2;">
        <label style="font-size: 0.75rem; font-weight: 700; color: #002b49; margin-bottom: 4px;">E-MAIL PARA LEMBRETE:*</label>
        <input type="email" id="m_email" placeholder="Ex: coordenacao.samu@orleans.sc.gov.br" style="padding: 9px; border: 1.5px solid #cbd5e1; border-radius: 8px; outline: none; width: 100%;">
      </div>

      <div style="display: flex; flex-direction: column; grid-column: span 2;">
        <label style="font-size: 0.75rem; font-weight: 700; color: #002b49; margin-bottom: 4px;">DESCRIÇÃO DETALHADA DOS SERVIÇOS:*</label>
        <textarea id="m_servicos" rows="3" placeholder="Descreva as peças trocadas ou serviços agendados..." required style="padding: 9px; border: 1.5px solid #cbd5e1; border-radius: 8px; outline: none; width: 100%;"></textarea>
      </div>
    </div>

    <button type="submit" id="btnSalvarManut" style="margin-top: 15px; width: 100%; padding: 12px; background: #16a34a; color: white; border: none; border-radius: 8px; font-weight: 800; font-size: 0.95rem; cursor: pointer;">
      💾 Salvar no Livro Digital
    </button>
  </form>

  <!-- HISTÓRICO -->
  <div style="margin-top: 25px; border-top: 2px dashed #cbd5e1; padding-top: 15px;">
    <h3 style="color: #002b49; font-size: 0.95rem; margin-bottom: 10px; text-align: left;">📜 Histórico do Livro Digital da Viatura</h3>
    <div style="overflow-x: auto;">
      <table style="width: 100%; border-collapse: collapse; font-size: 0.78rem;">
        <thead>
          <tr style="background: #002b49; color: white;">
            <th style="padding: 8px;">Data</th>
            <th style="padding: 8px;">Tipo</th>
            <th style="padding: 8px;">KM</th>
            <th style="padding: 8px;">Oficina</th>
            <th style="padding: 8px;">Serviços</th>
            <th style="padding: 8px;">Status</th>
          </tr>
        </thead>
        <tbody id="tbodyHistManut">
          <tr><td colspan="6" style="text-align:center; padding: 12px;">Selecione uma viatura para visualizar o histórico.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // Garante a existência da conexão Supabase localmente ou herdada do pai
  function obterConexaoSupabase() {
    if (window.dbNuvem) return window.dbNuvem;
    if (window.supabaseClient) return window.supabaseClient;
    if (typeof supabase !== 'undefined') {
      window.dbNuvem = supabase.createClient(
        "https://rcpgukslnlfptreiusff.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjcGd1a3NsbmxmcHRyZWl1c2ZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMDQ2MTYsImV4cCI6MjEwMjU4MDYxNn0.LgadTI7PwlLMBT5TbNkMncI0OfL22wjGAU_xanR4J6A"
      );
      return window.dbNuvem;
    }
    return null;
  }

  function alternarAbaManut(modo) {
    document.getElementById('m_modo_registro').value = modo;

    const btnExec = document.getElementById('btnAbaExec');
    const btnAgend = document.getElementById('btnAbaAgend');
    const boxExec = document.getElementById('boxDataExec');
    const boxAgend = document.getElementById('boxDataAgend');
    const boxNF = document.getElementById('boxNF');
    const boxValor = document.getElementById('boxValor');
    const boxEmail = document.getElementById('boxEmail');

    if (modo === 'EXECUTADO') {
      btnExec.style.background = '#002b49';
      btnExec.style.color = 'white';
      btnExec.style.borderColor = '#002b49';

      btnAgend.style.background = '#f8fafc';
      btnAgend.style.color = '#002b49';
      btnAgend.style.borderColor = '#cbd5e1';

      boxExec.style.display = 'flex';
      boxAgend.style.display = 'none';
      boxNF.style.display = 'flex';
      boxValor.style.display = 'flex';
      boxEmail.style.display = 'none';
    } else {
      btnAgend.style.background = '#002b49';
      btnAgend.style.color = 'white';
      btnAgend.style.borderColor = '#002b49';

      btnExec.style.background = '#f8fafc';
      btnExec.style.color = '#002b49';
      btnExec.style.borderColor = '#cbd5e1';

      boxExec.style.display = 'none';
      boxAgend.style.display = 'flex';
      boxNF.style.display = 'none';
      boxValor.style.display = 'none';
      boxEmail.style.display = 'flex';
    }
  }

  async function carregarListasFormManutencao() {
    const client = obterConexaoSupabase();
    if (!client) {
      console.error("Cliente Supabase não encontrado.");
      return;
    }

    try {
      // 1. Viaturas
      const { data: viaturas, error: errViat } = await client
        .from('operacional_viaturas')
        .select('*')
        .order('prefixo', { ascending: true });

      const selectViat = document.getElementById('m_viatura_id');
      if (viaturas && viaturas.length > 0) {
        selectViat.innerHTML = '<option value="">-- Selecione a Viatura --</option>';
        viaturas.forEach(v => {
          const pref = v.prefixo || 'Viatura';
          const mod = v.modelo || '';
          const plc = v.placa ? ` (${v.placa})` : '';
          selectViat.innerHTML += `<option value="${v.id}">${pref} - ${mod}${plc}</option>`;
        });
      } else {
        selectViat.innerHTML = '<option value="">Nenhuma viatura encontrada</option>';
      }

      // 2. Oficinas (Ativas)
      const { data: oficinas, error: errOfic } = await client
        .from('operacional_oficinas')
        .select('*')
        .order('razao_social', { ascending: true });

      const selectOfic = document.getElementById('m_oficina_id');
      if (oficinas && oficinas.length > 0) {
        selectOfic.innerHTML = '<option value="">-- Selecione a Oficina --</option>';
        oficinas.forEach(o => {
          if (o.status !== 'INATIVO') {
            const nomeExibicao = o.nome_fantasia || o.razao_social || 'Oficina';
            selectOfic.innerHTML += `<option value="${o.id}">${nomeExibicao}</option>`;
          }
        });
      } else {
        selectOfic.innerHTML = '<option value="">Nenhuma oficina ativa encontrada</option>';
      }

      // 3. Colaboradores
      const { data: colaboradores, error: errColab } = await client
        .from('colaboradores')
        .select('*')
        .order('nome', { ascending: true });

      const selectColab = document.getElementById('m_colaborador_id');
      if (colaboradores && colaboradores.length > 0) {
        selectColab.innerHTML = '<option value="">-- Selecione o Condutor/Responsável --</option>';
        colaboradores.forEach(c => {
          if (c.status !== 'DESLIGADO' && c.status_admin !== 'DESLIGADO') {
            const func = c.funcao ? ` (${c.funcao})` : '';
            selectColab.innerHTML += `<option value="${c.id}">${c.nome}${func}</option>`;
          }
        });
      } else {
        selectColab.innerHTML = '<option value="">Nenhum servidor encontrado</option>';
      }

    } catch (err) {
      console.error("Erro ao carregar seletores no formulário de manutenção:", err);
    }
  }

  async function carregarHistoricoManutencao() {
    const client = obterConexaoSupabase();
    const viaturaId = document.getElementById('m_viatura_id').value;
    const tbody = document.getElementById('tbodyHistManut');

    if (!viaturaId) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 12px;">Selecione uma viatura para visualizar o histórico.</td></tr>';
      return;
    }

    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 12px;">Buscando histórico da viatura...</td></tr>';

    try {
      const { data, error } = await client
        .from('operacional_manutencoes')
        .select('*')
        .eq('viatura_id', viaturaId)
        .order('data_registro', { ascending: false });

      if (error) throw error;

      if (data && data.length > 0) {
        tbody.innerHTML = '';
        data.forEach(m => {
          const dt = m.data_registro ? new Date(m.data_registro).toLocaleDateString('pt-BR') : '—';
          const statusCor = m.status === 'CONCLUIDO' ? '#15803d' : '#b45309';

          tbody.innerHTML += `
            <tr style="border-bottom: 1px solid #e2e8f0;">
              <td style="padding: 8px; font-weight: 700;">${dt}</td>
              <td style="padding: 8px;">${m.tipo_manutencao || '—'}</td>
              <td style="padding: 8px;">${m.km_registro || '—'} KM</td>
              <td style="padding: 8px;">${m.oficina_nome || '—'}</td>
              <td style="padding: 8px;">${m.servicos_executados || '—'}</td>
              <td style="padding: 8px; font-weight: 800; color: ${statusCor};">${m.status || 'CONCLUIDO'}</td>
            </tr>
          `;
        });
      } else {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 12px;">Nenhuma manutenção registrada para esta viatura.</td></tr>';
      }
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 12px; color: #d32f2f;">Erro ao consultar histórico.</td></tr>';
    }
  }

  async function salvarManutencaoLivro(e) {
    e.preventDefault();
    const client = obterConexaoSupabase();
    if (!client) {
      alert("❌ Falha na conexão com o banco de dados.");
      return;
    }

    const modo = document.getElementById('m_modo_registro').value;
    const selectOfic = document.getElementById('m_oficina_id');
    const oficinaTexto = selectOfic.options[selectOfic.selectedIndex] ? selectOfic.options[selectOfic.selectedIndex].text : '';

    const payload = {
      viatura_id: document.getElementById('m_viatura_id').value,
      oficina_id: selectOfic.value,
      oficina_nome: oficinaTexto,
      colaborador_id: document.getElementById('m_colaborador_id').value,
      km_registro: parseInt(document.getElementById('m_km').value) || 0,
      tipo_manutencao: document.getElementById('m_tipo').value,
      servicos_executados: document.getElementById('m_servicos').value.trim(),
      data_registro: modo === 'EXECUTADO' ? document.getElementById('m_data_exec').value : document.getElementById('m_data_agend').value,
      nota_fiscal: document.getElementById('m_nf').value.trim(),
      valor_total: parseFloat(document.getElementById('m_valor').value) || 0,
      email_lembrete: document.getElementById('m_email').value.trim(),
      status: modo === 'EXECUTADO' ? 'CONCLUIDO' : 'AGENDADO'
    };

    try {
      const { error } = await client.from('operacional_manutencoes').insert([payload]);
      if (error) throw error;

      alert("✅ Manutenção registrada com sucesso no Livro Digital!");
      document.getElementById('formManutAcao').reset();
      document.getElementById('m_data_exec').value = new Date().toISOString().split('T')[0];
      carregarHistoricoManutencao();
    } catch (err) {
      alert("❌ Erro ao salvar manutenção: " + err.message);
    }
  }

  // Executa imediatamente ao inserir no DOM
  (function inicializarModuloManutencao() {
    const elData = document.getElementById('m_data_exec');
    if (elData) elData.value = new Date().toISOString().split('T')[0];
    carregarListasFormManutencao();
  })();
</script>
