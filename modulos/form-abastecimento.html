<!-- ============================================================================
     MÓDULO: Form-Abastecimento (`modulos/form-abastecimento.html`)
     FINALIDADE: Formulário enxuto de abastecimento (viatura e condutor herdados).
     ============================================================================ -->
<div class="form-card" style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:12px; padding:20px; text-align:left;">
  <h3 style="color:#0d233a; font-size:0.95rem; text-transform:uppercase; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:6px;">
    ⛽ LANÇAMENTO DE ABASTECIMENTO
  </h3>
  
  <form id="formAbastecimento" onsubmit="salvarAbastecimento(event)">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;">
      
      <!-- SELETOR DE POSTOS DA TABELA operacional_postos -->
      <div style="display:flex; flex-direction:column;">
        <label style="font-size:0.72rem; font-weight:700; color:#0d233a; margin-bottom:4px; text-transform:uppercase;">Posto Credenciado:*</label>
        <select id="abs_posto" required style="padding:10px; border:1.5px solid #cbd5e1; border-radius:8px; font-size:0.88rem; outline:none; background:white;">
          <option value="">Carregando postos...</option>
        </select>
      </div>

      <!-- TIPO DE COMBUSTÍVEL -->
      <div style="display:flex; flex-direction:column;">
        <label style="font-size:0.72rem; font-weight:700; color:#0d233a; margin-bottom:4px; text-transform:uppercase;">Tipo de Insumo / Combustível:*</label>
        <select id="abs_combustivel" required style="padding:10px; border:1.5px solid #cbd5e1; border-radius:8px; font-size:0.88rem; outline:none; background:white;">
          <option value="Diesel S10">Diesel S10</option>
          <option value="Arla 32">Arla 32</option>
        </select>
      </div>

      <div style="display:flex; flex-direction:column;">
        <label style="font-size:0.72rem; font-weight:700; color:#0d233a; margin-bottom:4px; text-transform:uppercase;">KM Atual da Viatura:*</label>
        <input type="number" id="abs_km" placeholder="Ex: 148520" required style="padding:10px; border:1.5px solid #cbd5e1; border-radius:8px; font-size:0.88rem; outline:none;">
      </div>

      <div style="display:flex; flex-direction:column;">
        <label style="font-size:0.72rem; font-weight:700; color:#0d233a; margin-bottom:4px; text-transform:uppercase;">Litros Abastecidos:*</label>
        <input type="number" step="0.01" id="abs_litros" placeholder="Ex: 55.4" required style="padding:10px; border:1.5px solid #cbd5e1; border-radius:8px; font-size:0.88rem; outline:none;">
      </div>

    </div>

    <div style="display:flex; flex-direction:column; margin-top:12px;">
      <label style="font-size:0.72rem; font-weight:700; color:#0d233a; margin-bottom:4px; text-transform:uppercase;">Valor Total Pago (R$):*</label>
      <input type="number" step="0.01" id="abs_valor" placeholder="Ex: 340.50" required style="padding:10px; border:1.5px solid #cbd5e1; border-radius:8px; font-size:0.88rem; outline:none;">
    </div>

    <div style="display:flex; flex-direction:column; margin-top:12px;">
      <label style="font-size:0.72rem; font-weight:700; color:#0d233a; margin-bottom:4px; text-transform:uppercase;">Observações / Nota Fiscal:</label>
      <textarea id="abs_obs" rows="2" placeholder="Nº da nota fiscal ou observações adicionais..." style="padding:10px; border:1.5px solid #cbd5e1; border-radius:8px; font-size:0.88rem; outline:none; width:100%;"></textarea>
    </div>

    <button type="submit" style="margin-top:18px; background:#16a34a; color:white; border:none; padding:14px; border-radius:8px; font-weight:800; cursor:pointer; font-size:0.95rem; width:100%; transition:0.2s;">
      💾 Confirmar e Gravar no Supabase
    </button>
  </form>
</div>
