<!-- ============================================================================
     MÓDULO: Form-Lacre (`modulos/form-lacre.html`)
     FINALIDADE: Registro de substituição de lacre de segurança.
     ============================================================================ -->
<div class="form-card" style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:12px; padding:20px; text-align:left;">
  <h3 style="color:#0d233a; font-size:0.95rem; text-transform:uppercase; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:6px;">
    🔒 REGISTRO DE SUBSTITUIÇÃO DE LACRE DE SEGURANÇA
  </h3>

  <form id="formLacre" onsubmit="salvarSubstituicaoLacre(event)">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom:12px;">
      <div style="display:flex; flex-direction:column;">
        <label style="font-size:0.72rem; font-weight:700; color:#0d233a; margin-bottom:4px; text-transform:uppercase;">Número Lacre Rompido:*</label>
        <input type="text" id="lacre_ant" placeholder="Ex: 123455" required style="padding:10px; border:1.5px solid #cbd5e1; border-radius:8px; font-size:0.88rem; outline:none;">
      </div>

      <div style="display:flex; flex-direction:column;">
        <label style="font-size:0.72rem; font-weight:700; color:#0d233a; margin-bottom:4px; text-transform:uppercase;">Número Novo Lacre Aplicado:*</label>
        <input type="text" id="lacre_novo" placeholder="Ex: 123456" required style="padding:10px; border:1.5px solid #cbd5e1; border-radius:8px; font-size:0.88rem; outline:none;">
      </div>
    </div>

    <div style="display:flex; flex-direction:column; margin-bottom:12px;">
      <label style="font-size:0.72rem; font-weight:700; color:#0d233a; margin-bottom:4px; text-transform:uppercase;">Motivo da Substituição:*</label>
      <select id="lacre_motivo" required style="padding:10px; border:1.5px solid #cbd5e1; border-radius:8px; font-size:0.88rem; outline:none; background:white;">
        <option value="">Selecione o motivo...</option>
        <option value="Conferência Periódica / Rotina">Conferência Periódica / Rotina</option>
        <option value="Avaria ou Defeito Físico no Lacre Anterior">Avaria ou Defeito Físico no Lacre Anterior</option>
        <option value="Vencimento de Lotes / Insumos">Vencimento de Lotes / Insumos</option>
        <option value="Outros Motivos Operacionais">Outros Motivos Operacionais</option>
      </select>
    </div>

    <div style="display:flex; flex-direction:column; margin-bottom:12px;">
      <label style="font-size:0.72rem; font-weight:700; color:#0d233a; margin-bottom:4px; text-transform:uppercase;">Observações da Ocorrência:</label>
      <textarea id="lacre_obs" rows="3" placeholder="Detalhes adicionais sobre a troca..." style="padding:10px; border:1.5px solid #cbd5e1; border-radius:8px; font-size:0.88rem; outline:none; width:100%;"></textarea>
    </div>

    <button type="submit" style="margin-top:18px; background:#16a34a; color:white; border:none; padding:14px; border-radius:8px; font-weight:800; cursor:pointer; font-size:0.95rem; width:100%; transition:0.2s;">
      💾 Registrar Troca de Lacre no Supabase
    </button>
  </form>
</div>
