<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMU Connect — Central de Fichas APH</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --navy: #002b49;
      --blue: #1976d2;
      --red: #d32f2f;
      --bg: #f4f7fa;
      --border: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
    body { background-color: var(--bg); color: #000; padding: 20px 12px; }

    .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 20px; }
    
    .header-app { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #cbd5e1; padding-bottom: 12px; }
    .header-app h1 { color: var(--navy); font-size: 1.2rem; font-weight: 800; text-transform: uppercase; }

    #boxAuth { max-width: 350px; margin: 40px auto; text-align: center; background: #f8fafc; padding: 20px; border-radius: 12px; border: 1.5px solid #cbd5e1; }
    #boxAuth input { width: 100%; padding: 10px; border: 1.5px solid #cbd5e1; border-radius: 8px; margin: 10px 0; text-align: center; font-size: 1.1rem; font-weight: 700; outline: none; }
    #boxAuth button { width: 100%; padding: 10px; background: var(--navy); color: white; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; }

    #areaFichas { display: none; }
    
    .busca-box { display: flex; gap: 10px; margin-bottom: 15px; }
    .busca-box input { flex: 1; padding: 10px; border: 1.5px solid #cbd5e1; border-radius: 8px; outline: none; }

    table.tbl-lista { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 10px; }
    table.tbl-lista th { background: var(--navy); color: white; padding: 10px; text-align: left; }
    table.tbl-lista td { padding: 10px; border-bottom: 1px solid #cbd5e1; }

    .btn-print { background: #16a34a; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.75rem; }

    /* ESTILO EXATO DA FICHA APH OFICIAL */
    .ficha-oficial { display: none; background: #fff; padding: 10px; border: 2px solid #000; font-size: 11px; color: #000; }
    .ficha-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 8px; }
    .ficha-header h2 { font-size: 15px; font-weight: 900; margin: 0; }
    .ficha-header h3 { font-size: 13px; font-weight: 800; margin-top: 2px; }

    .sec-title { background: #000; color: #fff; font-weight: 800; padding: 3px 6px; font-size: 11px; margin-top: 8px; text-transform: uppercase; }
    
    .grid-box { display: grid; border: 1px solid #000; margin-top: -1px; }
    .cell { padding: 4px 6px; border-right: 1px solid #000; border-bottom: 1px solid #000; word-break: break-word; }
    .cell:last-child { border-right: none; }
    .lbl { font-size: 9px; font-weight: 800; color: #333; display: block; text-transform: uppercase; }
    .val { font-size: 11px; font-weight: 700; color: #000; }

    table.tbl-ficha { width: 100%; border-collapse: collapse; border: 1px solid #000; margin-top: -1px; }
    table.tbl-ficha th, table.tbl-ficha td { border: 1px solid #000; padding: 4px; text-align: center; font-size: 10px; }
    table.tbl-ficha th { background: #f0f0f0; font-weight: 800; }

    /* IMPRESSÃO A4 */
    @media print {
      body { background: white; padding: 0; margin: 0; }
      .no-print { display: none !important; }
      .container { box-shadow: none; border: none; padding: 0; max-width: 100%; }
      .ficha-oficial { display: block !important; border: none; padding: 0; }
      @page { size: A4; margin: 8mm; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div id="boxAuth" class="no-print">
      <h2 style="font-size: 1rem; color: var(--navy); margin-bottom: 8px;">🔑 Acesso Restrito Hospital</h2>
      <p style="font-size: 0.75rem; color: #64748b;">Digite a senha única para visualizar e imprimir as fichas APH do plantão.</p>
      <input type="password" id="inputSenhaAcesso" placeholder="Digite a Senha..." onkeypress="tratarTecla(event)">
      <button type="button" onclick="validarAcesso()">Acessar Fichas</button>
    </div>

    <div id="areaFichas">
      
      <div class="header-app no-print">
        <h1>🏥 SAMU CONNECT — CONSULTA & IMPRESSÃO DE FICHAS APH</h1>
        <p style="font-size: 0.8rem; color: #555;">USB 11 ORLEANS — Emissão oficial de Ficha APH em formato padrão</p>
      </div>

      <div class="busca-box no-print">
        <input type="text" id="inputBusca" placeholder="🔍 Buscar por Nome do Paciente, Ocorrência ou Viatura..." onkeyup="filtrarTabela()">
        <button type="button" onclick="carregarFichasAPH()" style="padding: 10px 15px; background: var(--blue); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;">🔄 Atualizar</button>
      </div>

      <div class="no-print" style="overflow-x: auto;">
        <table class="tbl-lista">
          <thead>
            <tr>
              <th>Data / Hora</th>
              <th>Paciente</th>
              <th>Viatura</th>
              <th>Ocorrência</th>
              <th style="text-align: center;">Ação</th>
            </tr>
          </thead>
          <tbody id="tbodyFichas">
            <tr><td colspan="5" style="text-align: center; padding: 15px;">Carregando fichas...</td></tr>
          </tbody>
        </table>
      </div>

      <div id="areaFichaImpressao" class="ficha-oficial">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;" class="no-print">
          <button onclick="fecharFichaImpressao()" style="padding: 6px 12px; background: #64748b; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 700;">⬅️ Voltar à Lista</button>
          <button onclick="window.print()" style="padding: 10px 20px; background: #16a34a; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 800; font-size: 0.9rem;">🖨️ Imprimir Ficha Oficial</button>
        </div>

        <div id="conteudoFichaDetalhada"></div>

      </div>

    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://rcpgukslnlfptreiusff.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjcGd1a3NsbmxmcHRyZWl1c2ZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMDQ2MTYsImV4cCI6MjEwMjU4MDYxNn0.LgadTI7PwlLMBT5TbNkMncI0OfL22wjGAU_xanR4J6A";

    window.dbNuvem = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let listaFichasCache = [];

    function tratarTecla(e) { if (e.key === 'Enter') validarAcesso(); }

    function validarAcesso() {
      const senha = document.getElementById('inputSenhaAcesso').value.trim();
      if (senha === '192' || senha === 'samu192' || senha === '123456') {
        document.getElementById('boxAuth').style.display = 'none';
        document.getElementById('areaFichas').style.display = 'block';
        carregarFichasAPH();
      } else {
        alert("❌ Senha incorreta.");
      }
    }

    function g(obj, ...chaves) {
      for (let c of chaves) {
        if (obj && obj[c] !== undefined && obj[c] !== null && String(obj[c]).trim() !== "") {
          return obj[c];
        }
      }
      return '—';
    }

    async function carregarFichasAPH() {
      const tbody = document.getElementById('tbodyFichas');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 15px;">Buscando registros na tabela ocorrencias_aph...</td></tr>';

      try {
        const { data, error } = await window.dbNuvem
          .from('ocorrencias_aph')
          .select('*')
          .order('id', { ascending: false })
          .limit(30);

        if (error) throw error;
        listaFichasCache = data || [];

        if (listaFichasCache.length > 0) {
          renderizarTabela(listaFichasCache);
        } else {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 15px;">Nenhuma ocorrência encontrada em ocorrencias_aph.</td></tr>';
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 15px; color: var(--red);"><b>Erro:</b> ${err.message || 'Falha ao consultar Supabase.'}</td></tr>`;
      }
    }

    function renderizarTabela(dados) {
      const tbody = document.getElementById('tbodyFichas');
      tbody.innerHTML = '';

      dados.forEach((f, idx) => {
        const dt = g(f, 'data_hora', 'data_atendimento', 'created_at');
        const dtFmt = dt !== '—' ? dt.replace('T', ' ').substring(0, 16) : '—';
        const paciente = g(f, 'nome_paciente', 'paciente_nome', 'paciente', 'nome_completo');
        const viatura = g(f, 'viatura', 'prefixo', 'viatura_prefixo');
        const ocorr = g(f, 'numero_ocorrencia', 'num_ocorrencia', 'ocorrencia', 'numero');

        tbody.innerHTML += `
          <tr>
            <td><b>${dtFmt}</b></td>
            <td>${paciente}</td>
            <td>${viatura}</td>
            <td>${ocorr}</td>
            <td style="text-align: center;">
              <button class="btn-print" onclick="abrirFichaParaImpressao(${idx})">🖨️ Imprimir</button>
            </td>
          </tr>
        `;
      });
    }

    function filtrarTabela() {
      const termo = document.getElementById('inputBusca').value.toLowerCase();
      const filtrados = listaFichasCache.filter(f => {
        const pac = g(f, 'nome_paciente', 'paciente_nome', 'paciente', 'nome_completo').toLowerCase();
        const viat = g(f, 'viatura', 'prefixo').toLowerCase();
        const ocorr = g(f, 'numero_ocorrencia', 'num_ocorrencia', 'ocorrencia').toLowerCase();
        return pac.includes(termo) || viat.includes(termo) || ocorr.includes(termo);
      });
      renderizarTabela(filtrados);
    }

    function abrirFichaParaImpressao(index) {
      const f = listaFichasCache[index];
      if (!f) return;

      const dtFull = g(f, 'data_hora', 'data_atendimento', 'created_at');
      const dtData = dtFull !== '—' ? dtFull.split('T')[0].split('-').reverse().join('/') : '—';
      const dtHora = dtFull !== '—' && dtFull.includes('T') ? dtFull.split('T')[1].substring(0,5) : '—';

      const htmlOficial = `
        <div class="ficha-header">
          <h2>SAMU 192 - ORLEANS / SC</h2>
          <h3>FICHA DE ATENDIMENTO MÓVEL DE URGÊNCIA (${g(f, 'viatura', 'prefixo') !== '—' ? g(f, 'viatura', 'prefixo') : 'USB 11'})</h3>
        </div>

        <div class="sec-title">1. CONTROLE OPERACIONAL & EQUIPE</div>
        <div class="grid-box" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
          <div class="cell"><span class="lbl">Nº OCORRÊNCIA</span><span class="val">${g(f, 'numero_ocorrencia', 'num_ocorrencia', 'ocorrencia')}</span></div>
          <div class="cell"><span class="lbl">CÓDIGO TRIAGEM</span><span class="val">${g(f, 'codigo_triagem', 'triagem', 'cor_triagem')}</span></div>
          <div class="cell"><span class="lbl">DATA</span><span class="val">${dtData}</span></div>
          <div class="cell"><span class="lbl">MOTIVO ACIONAMENTO</span><span class="val">${g(f, 'motivo_acionamento', 'motivo', 'queixa_principal')}</span></div>
        </div>
        <div class="grid-box" style="grid-template-columns: 1fr 1fr 1fr;">
          <div class="cell"><span class="lbl">MÉDICO REGULADOR INICIAL</span><span class="val">${g(f, 'medico_regulador', 'medico_regulador_inicial', 'medico')}</span></div>
          <div class="cell"><span class="lbl">TÉC. DE ENFERMAGEM</span><span class="val">${g(f, 'tec_enfermagem', 'tecnico_enfermagem', 'tecnico_nome', 'tecnico')}</span></div>
          <div class="cell"><span class="lbl">SOCORRISTA (CONDUTOR)</span><span class="val">${g(f, 'condutor_nome', 'socorrista_nome', 'condutor', 'socorrista')}</span></div>
        </div>
        <div class="grid-box" style="grid-template-columns: repeat(6, 1fr);">
          <div class="cell"><span class="lbl">SAÍDA BASE</span><span class="val">${g(f, 'hora_saida_base', 'saida_base') !== '—' ? g(f, 'hora_saida_base', 'saida_base') : dtHora}</span></div>
          <div class="cell"><span class="lbl">CHEG. LOCAL</span><span class="val">${g(f, 'hora_cheg_local', 'chegada_local')}</span></div>
          <div class="cell"><span class="lbl">SAÍDA LOCAL</span><span class="val">${g(f, 'hora_saida_local', 'saida_local')}</span></div>
          <div class="cell"><span class="lbl">DESTINO</span><span class="val">${g(f, 'hora_destino', 'chegada_destino')}</span></div>
          <div class="cell"><span class="lbl">DISPONÍVEL</span><span class="val">${g(f, 'hora_disponivel', 'disponivel')}</span></div>
          <div class="cell"><span class="lbl">NA BASE</span><span class="val">${g(f, 'hora_na_base', 'retorno_base')}</span></div>
        </div>

        <div class="sec-title">2. IDENTIFICAÇÃO DO PACIENTE & LOCAL</div>
        <div class="grid-box" style="grid-template-columns: 2fr 1fr 1fr 1fr;">
          <div class="cell"><span class="lbl">NOME COMPLETO DO PACIENTE</span><span class="val">${g(f, 'nome_paciente', 'paciente_nome', 'paciente', 'nome_completo')}</span></div>
          <div class="cell"><span class="lbl">CPF / RG</span><span class="val">${g(f, 'cpf', 'documento', 'rg')}</span></div>
          <div class="cell"><span class="lbl">DATA NASC.</span><span class="val">${g(f, 'data_nasc', 'data_nascimento', 'dt_nasc')}</span></div>
          <div class="cell"><span class="lbl">IDADE / SEXO</span><span class="val">${g(f, 'idade')} | ${g(f, 'sexo')}</span></div>
        </div>
        <div class="grid-box" style="grid-template-columns: 2fr 1fr 1fr;">
          <div class="cell"><span class="lbl">RUA / LOGRADOURO</span><span class="val">${g(f, 'rua', 'logradouro', 'endereco')}</span></div>
          <div class="cell"><span class="lbl">BAIRRO</span><span class="val">${g(f, 'bairro')}</span></div>
          <div class="cell"><span class="lbl">MUNICÍPIO / UF</span><span class="val">${g(f, 'municipio', 'cidade')} / ${g(f, 'uf', 'estado')}</span></div>
        </div>

        <div class="sec-title">3. TIPO OCORRÊNCIA</div>
        <div class="grid-box" style="grid-template-columns: 1fr;">
          <div class="cell"><span class="lbl">NATUREZA DO ATENDIMENTO</span><span class="val">${g(f, 'tipo_ocorrencia', 'natureza_ocorrencia', 'natureza')}</span></div>
        </div>

        <div class="sec-title">4. AVALIAÇÃO TÁTICA & EXAME FÍSICO (ABCDE)</div>
        <div class="grid-box" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
          <div class="cell"><span class="lbl">A - VIAS AÉREAS</span><span class="val">${g(f, 'vias_aereas', 'a_vias_aereas')}</span></div>
          <div class="cell"><span class="lbl">B - RESPIRAÇÃO</span><span class="val">${g(f, 'respiracao', 'b_respiracao')}</span></div>
          <div class="cell"><span class="lbl">C - PULSO / PELE</span><span class="val">${g(f, 'pulso_pele', 'c_circulacao')}</span></div>
          <div class="cell"><span class="lbl">D - GLASGOW TOTAL</span><span class="val">${g(f, 'glasgow', 'escala_glasgow')}</span></div>
        </div>

        <div class="sec-title">5. SINAIS VITAIS (MEDIÇÕES APH)</div>
        <table class="tbl-ficha">
          <thead>
            <tr>
              <th>HORA</th>
              <th>PA (MMHG)</th>
              <th>FC (BPM)</th>
              <th>FR (MPM)</th>
              <th>SPO2 (%)</th>
              <th>TEMP (°C)</th>
              <th>HGT (MG/DL)</th>
              <th>PUPILAS</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>${dtHora}</td>
              <td>${g(f, 'pa', 'pressao_arterial', 'pressao')}</td>
              <td>${g(f, 'fc', 'frequencia_cardiaca', 'frequencia')}</td>
              <td>${g(f, 'fr', 'frequencia_respiratoria')}</td>
              <td>${g(f, 'spo2', 'saturacao', 'sat')}%</td>
              <td>${g(f, 'temperatura', 'temp')}</td>
              <td>${g(f, 'glicemia', 'hgt')}</td>
              <td>${g(f, 'pupilas')}</td>
            </tr>
          </tbody>
        </table>

        <div class="sec-title">6. MEDICAÇÕES & INSUMOS UTILIZADOS</div>
        <div class="grid-box" style="grid-template-columns: 1fr;">
          <div class="cell"><span class="val">${g(f, 'insumos_utilizados', 'insumos', 'medicacoes')}</span></div>
        </div>

        <div class="sec-title">7. ANAMNESE, EVOLUÇÃO E CONDUTA</div>
        <div class="grid-box" style="grid-template-columns: 1fr;">
          <div class="cell" style="min-height: 50px;">
            <span class="lbl">EVOLUÇÃO E CONDUTA</span>
            <span class="val" style="font-weight: normal; font-size: 10px;">${g(f, 'relato_ocorrencia', 'observacoes', 'procedimentos', 'relato', 'conduta', 'anamnese')}</span>
          </div>
        </div>

        <div class="sec-title">8. DESFECHO DO ATENDIMENTO & ASSINATURA</div>
        <div class="grid-box" style="grid-template-columns: 1fr 1fr;">
          <div class="cell"><span class="lbl">DESFECHO / DESTINO</span><span class="val">${g(f, 'desfecho', 'desfecho_atendimento')}</span></div>
          <div class="cell"><span class="lbl">HOSPITAL RECEPTOR</span><span class="val">${g(f, 'hospital_destino', 'destino', 'hospital')}</span></div>
        </div>

        <div style="margin-top: 35px; display: flex; justify-content: space-around; text-align: center;">
          <div>
            _______________________________________<br>
            <b>${g(f, 'condutor_nome', 'socorrista_nome', 'condutor')}</b><br>
            <span style="font-size: 9px;">Assinatura do Socorrista</span>
          </div>
          <div>
            _______________________________________<br>
            <b>${g(f, 'tec_enfermagem', 'tecnico_nome', 'tecnico')}</b><br>
            <span style="font-size: 9px;">Assinatura / COREN / CRM</span>
          </div>
        </div>
      `;

      document.getElementById('conteudoFichaDetalhada').innerHTML = htmlOficial;
      document.querySelector('.tbl-lista').style.display = 'none';
      document.querySelector('.busca-box').style.display = 'none';
      document.getElementById('areaFichaImpressao').style.display = 'block';
    }

    function fecharFichaImpressao() {
      document.getElementById('areaFichaImpressao').style.display = 'none';
      document.querySelector('.tbl-lista').style.display = 'table';
      document.querySelector('.busca-box').style.display = 'flex';
    }
  </script>
</body>
</html>
