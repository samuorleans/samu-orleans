<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMU Connect — Central de Fichas APH</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --navy: #0f172a;
      --blue: #0284c7;
      --red: #dc2626;
      --bg: #f8fafc;
      --border: #000000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif; }
    body { background-color: var(--bg); color: #000; padding: 15px 10px; }

    .container { max-width: 950px; margin: 0 auto; background: white; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 15px; }
    
    .header-app { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #cbd5e1; padding-bottom: 12px; }
    .header-app h1 { color: var(--navy); font-size: 1.2rem; font-weight: 800; text-transform: uppercase; }

    #boxAuth { max-width: 350px; margin: 40px auto; text-align: center; background: #f8fafc; padding: 20px; border-radius: 12px; border: 1.5px solid #cbd5e1; }
    #boxAuth input { width: 100%; padding: 10px; border: 1.5px solid #cbd5e1; border-radius: 8px; margin: 10px 0; text-align: center; font-size: 1.1rem; font-weight: 700; outline: none; }
    #boxAuth button { width: 100%; padding: 10px; background: var(--navy); color: white; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; }

    #areaFichas { display: none; }
    
    .busca-box { display: flex; gap: 10px; margin-bottom: 15px; }
    .busca-box input { flex: 1; padding: 10px; border: 1.5px solid #cbd5e1; border-radius: 8px; outline: none; }

    table.tbl-lista { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 10px; }
    table.tbl-lista th { background: var(--navy); color: white; padding: 10px; text-align: left; }
    table.tbl-lista td { padding: 10px; border-bottom: 1px solid #cbd5e1; }

    .btn-print { background: #16a34a; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.75rem; }

    /* ESTILO FIEL AO GRID DA FICHA APH OFICIAL */
    .ficha-oficial { display: none; background: #fff; padding: 5px; color: #000; font-size: 9.5px; }
    .ficha-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 4px; margin-bottom: 6px; }
    .ficha-header h2 { font-size: 14px; font-weight: 900; margin: 0; }
    .ficha-header h3 { font-size: 11.5px; font-weight: 800; margin-top: 2px; }

    .sec-title { background: #000; color: #fff; font-weight: 800; padding: 2px 5px; font-size: 9.5px; margin-top: 6px; text-transform: uppercase; }
    
    .grid-box { display: grid; border: 1px solid #000; margin-top: -1px; }
    .cell { padding: 3px 5px; border-right: 1px solid #000; border-bottom: 1px solid #000; word-break: break-word; }
    .cell:last-child { border-right: none; }
    .lbl { font-size: 8px; font-weight: 800; color: #333; display: block; text-transform: uppercase; }
    .val { font-size: 9.5px; font-weight: 700; color: #000; }

    table.tbl-ficha { width: 100%; border-collapse: collapse; border: 1px solid #000; margin-top: -1px; }
    table.tbl-ficha th, table.tbl-ficha td { border: 1px solid #000; padding: 3px 4px; text-align: center; font-size: 9px; }
    table.tbl-ficha th { background: #f0f0f0; font-weight: 800; }

    /* IMPRESSÃO A4 */
    @media print {
      body { background: white; padding: 0; margin: 0; }
      .no-print { display: none !important; }
      .container { box-shadow: none; border: none; padding: 0; max-width: 100%; }
      .ficha-oficial { display: block !important; border: none; padding: 0; }
      @page { size: A4 portrait; margin: 5mm; }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div id="boxAuth" class="no-print">
      <h2 style="font-size: 1rem; color: var(--navy); margin-bottom: 8px;">🔑 Acesso Restrito Hospital</h2>
      <p style="font-size: 0.75rem; color: #64748b;">Digite a senha única para visualizar e imprimir as fichas APH do plantão.</p>
      <input type="password" id="inputSenhaAcesso" placeholder="Digite a Senha..." onkeypress="tratarTecla(event)">
      <button type="button" onclick="validarAcesso()">Acessar Fichas</button>
    </div>

    <div id="areaFichas">
      
      <div class="header-app no-print">
        <h1>🏥 SAMU CONNECT — CONSULTA & IMPRESSÃO DE FICHAS APH</h1>
        <p style="font-size: 0.8rem; color: #555;">USB 11 ORLEANS — Emissão de Ficha APH com Mapeamento Completo de Grids</p>
      </div>

      <div class="busca-box no-print">
        <input type="text" id="inputBusca" placeholder="🔍 Buscar por Nome do Paciente, Ocorrência ou Viatura..." onkeyup="filtrarTabela()">
        <button type="button" onclick="carregarFichasAPH()" style="padding: 10px 15px; background: var(--blue); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;">🔄 Atualizar</button>
      </div>

      <div class="no-print" style="overflow-x: auto;">
        <table class="tbl-lista">
          <thead>
            <tr>
              <th>Data / Hora</th>
              <th>Paciente</th>
              <th>Viatura</th>
              <th>Ocorrência</th>
              <th style="text-align: center;">Ação</th>
            </tr>
          </thead>
          <tbody id="tbodyFichas">
            <tr><td colspan="5" style="text-align: center; padding: 15px;">Carregando fichas...</td></tr>
          </tbody>
        </table>
      </div>

      <div id="areaFichaImpressao" class="ficha-oficial">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;" class="no-print">
          <button onclick="fecharFichaImpressao()" style="padding: 6px 12px; background: #64748b; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 700;">⬅️ Voltar à Lista</button>
          <button onclick="window.print()" style="padding: 10px 20px; background: #16a34a; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 800; font-size: 0.9rem;">🖨️ Imprimir Ficha Completa</button>
        </div>

        <div id="conteudoFichaDetalhada"></div>
      </div>

    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://rcpgukslnlfptreiusff.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjcGd1a3NsbmxmcHRreWV1c2ZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMDQ2MTYsImV4cCI6MjEwMjU4MDYxNn0.LgadTI7PwlLMBT5TbNkMncI0OfL22wjGAU_xanR4J6A";

    window.dbNuvem = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
    let listaFichasCache = [];

    function tratarTecla(e) { if (e.key === 'Enter') validarAcesso(); }

    function validarAcesso() {
      const senha = document.getElementById('inputSenhaAcesso').value.trim();
      if (senha === '192' || senha === 'samu192' || senha === '123456') {
        document.getElementById('boxAuth').style.display = 'none';
        document.getElementById('areaFichas').style.display = 'block';
        carregarFichasAPH();
      } else {
        alert("❌ Senha incorreta.");
      }
    }

    function v(val, padrao = '—') {
      if (val === undefined || val === null || String(val).trim() === '' || String(val).trim() === 'nan') {
        return padrao;
      }
      return String(val).trim();
    }

    function formatarDataBR(strData) {
      if (!strData || strData === '—') return '—';
      const partes = strData.split('T')[0].split('-');
      if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
      return strData;
    }

    async function carregarFichasAPH() {
      const tbody = document.getElementById('tbodyFichas');
      tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 15px;">Buscando registros na tabela ocorrencias_aph...</td></tr>';

      try {
        const client = window.dbNuvem || window.supabaseClient;
        const { data, error } = await client
          .from('ocorrencias_aph')
          .select('*')
          .order('id', { ascending: false })
          .limit(30);

        if (error) throw error;
        listaFichasCache = data || [];

        if (listaFichasCache.length > 0) {
          renderizarTabela(listaFichasCache);
        } else {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 15px;">Nenhuma ocorrência encontrada em ocorrencias_aph.</td></tr>';
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 15px; color: var(--red);"><b>Erro:</b> ${err.message || 'Falha ao consultar Supabase.'}</td></tr>`;
      }
    }

    function renderizarTabela(dados) {
      const tbody = document.getElementById('tbodyFichas');
      tbody.innerHTML = '';

      dados.forEach((f, idx) => {
        const dt = formatarDataBR(v(f.data)) !== '—' ? formatarDataBR(v(f.data)) : v(f.created_at).substring(0,10);
        const hr = v(f.hora_j9) !== '—' ? f.hora_j9 : (v(f.created_at).includes('T') ? f.created_at.split('T')[1].substring(0,5) : '');
        const paciente = v(f.paciente, 'Paciente Não Identificado');
        const viatura = 'USB 11';
        const ocorr = v(f.codigo_ocorrencia);

        tbody.innerHTML += `
          <tr>
            <td><b>${dt} ${hr}</b></td>
            <td>${paciente}</td>
            <td>${viatura}</td>
            <td>${ocorr}</td>
            <td style="text-align: center;">
              <button class="btn-print" onclick="abrirFichaParaImpressao(${idx})">🖨️ Imprimir</button>
            </td>
          </tr>
        `;
      });
    }

    function filtrarTabela() {
      const termo = document.getElementById('inputBusca').value.toLowerCase();
      const filtrados = listaFichasCache.filter(f => {
        const pac = v(f.paciente).toLowerCase();
        const ocorr = v(f.codigo_ocorrencia).toLowerCase();
        return pac.includes(termo) || ocorr.includes(termo);
      });
      renderizarTabela(filtrados);
    }

    function formatarLesoesGrid(lesoesRaw) {
      let lesoes = {};
      try {
        lesoes = typeof lesoesRaw === 'string' ? JSON.parse(lesoesRaw) : (lesoesRaw || {});
      } catch(e){}

      const regioes = [
        { key: 'Cabeca/Pescoco', label: 'Cabeça/Pescoço' },
        { key: 'Tronco', label: 'Tronco' },
        { key: 'Pelve', label: 'Pelve' },
        { key: 'MSup', label: 'M. Superior (D/E)' },
        { key: 'MInf', label: 'M. Inferior (D/E)' }
      ];

      let rowsHtml = '';
      regioes.forEach(r => {
        const item = lesoes[r.key] || {};
        rowsHtml += `
          <tr>
            <td style="text-align: left; font-weight: bold;">${r.label}</td>
            <td>${item.ferida ? '✖' : ''}</td>
            <td>${item.fratura ? '✖' : ''}</td>
            <td>${item.queimadura ? '✖' : ''}</td>
            <td>${item.escoriacao ? '✖' : ''}</td>
            <td>${item.edema ? '✖' : ''}</td>
          </tr>
        `;
      });

      return `
        <table class="tbl-ficha" style="margin-top: 4px;">
          <thead>
            <tr>
              <th style="text-align: left;">REGIÃO</th>
              <th>FERIDA/CORTE</th>
              <th>FRATURA/LUXACIÓN</th>
              <th>QUEIMADURA</th>
              <th>ESCORIAÇÃO</th>
              <th>EDEMA/HEMATOMA</th>
            </tr>
          </thead>
          <tbody>
            ${rowsHtml}
          </tbody>
        </table>
      `;
    }

    function abrirFichaParaImpressao(index) {
      const f = listaFichasCache[index];
      if (!f) return;

      // Parse Sinais Vitais (JSON)
      let sv = [];
      try {
        if (f.sinais_vitais) {
          sv = typeof f.sinais_vitais === 'string' ? JSON.parse(f.sinais_vitais) : f.sinais_vitais;
        }
      } catch(e){}

      let svRowsHtml = '';
      if (Array.isArray(sv) && sv.length > 0) {
        sv.forEach(r => {
          svRowsHtml += `
            <tr>
              <td>${v(r.hora, v(f.hora_j10))}</td>
              <td>${v(r.pa)}</td>
              <td>${v(r.fc)}</td>
              <td>${v(r.fr)}</td>
              <td>${v(r.spo2) !== '—' ? v(r.spo2) + '%' : '—'}</td>
              <td>${v(r.temp)}</td>
              <td>${v(r.hgt)}</td>
              <td>${v(f.pupilas)}</td>
            </tr>
          `;
        });
      } else {
        svRowsHtml = `
          <tr>
            <td>${v(f.hora_j10)}</td>
            <td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td>
            <td>${v(f.pupilas)}</td>
          </tr>
        `;
      }

      // Parse Insumos e Psicotrópicos (JSON)
      let insumosHtml = '';
      try {
        let insList = typeof f.insumos_utilizados === 'string' ? JSON.parse(f.insumos_utilizados) : f.insumos_utilizados;
        if (Array.isArray(insList) && insList.length > 0) {
          insList.forEach(i => {
            const desc = v(i.descricao, v(i.nome));
            const qtd = v(i.quantidade, '1');
            const lote = v(i.numero_lote, 'SEM LOTE');
            const val = i.data_validade ? formatarDataBR(i.data_validade) : 'N/A';
            let detalhePsico = '';
            
            if (i.is_psicotropico) {
              detalhePsico = ` <span style="color: #991b1b; font-weight: bold;">[PSICOTRÓPICO | VIA: ${v(i.via_administrada)} | LACRE ROMPIDO: ${v(i.lacre_rompido)} | LACRE NOVO: ${v(i.lacre_novo)}]</span>`;
            }

            if (desc !== '—' && desc !== 'NENHUM INSUMO OU MEDICAÇÃO UTILIZADO') {
              insumosHtml += `<div style="margin-bottom: 2px;">• <b>${desc}</b> — LOTE: ${lote} | VAL: ${val} (<b>QTD: ${qtd}</b>)${detalhePsico}</div>`;
            }
          });
        }
      } catch(e){}
      if (!insumosHtml) insumosHtml = 'NENHUM INSUMO OU MEDICAÇÃO REGISTRADO';

      // Glasgow e Cores de Triagem
      const gTot = v(f.glasgow_total);
      const gOc = v(f.glasgow_ocular);
      const gVerb = v(f.glasgow_verbal);
      const gMot = v(f.glasgow_motor);

      let corTriagem = v(f.cor_ocorrencia);
      const cores = { 'VM': 'VERMELHO (VM)', 'AM': 'AMARELO (AM)', 'VD': 'VERDE (VD)', 'AZ': 'AZUL (AZ)' };
      corTriagem = cores[corTriagem] || corTriagem;

      let reclassificacaoStr = 'SEM ALTERAÇÃO';
      if (v(f.reclassificacao_codigo) !== '—') {
        reclassificacaoStr = `${cores[f.reclassificacao_codigo] || f.reclassificacao_codigo} às ${v(f.reclassificacao_hora)} (Dr(a). ${v(f.reclassificacao_medico)})`;
      }

      let sexoFmt = v(f.sexo);
      if (sexoFmt === 'M') sexoFmt = 'Masculino (M)';
      else if (sexoFmt === 'F') sexoFmt = 'Feminino (F)';

      const htmlOficial = `
        <div class="ficha-header">
          <h2>SAMU 192 - ORLEANS / SC</h2>
          <h3>FICHA DE ATENDIMENTO MÓVEL DE URGÊNCIA (USB 11)</h3>
        </div>

        <!-- 1. CONTROLE OPERACIONAL -->
        <div class="sec-title">1. CONTROLE OPERACIONAL & EQUIPE</div>
        <div class="grid-box" style="grid-template-columns: 1fr 1fr 1fr 1.5fr;">
          <div class="cell"><span class="lbl">Nº OCORRÊNCIA</span><span class="val">${v(f.codigo_ocorrencia)}</span></div>
          <div class="cell"><span class="lbl">CÓDIGO TRIAGEM</span><span class="val">${corTriagem}</span></div>
          <div class="cell"><span class="lbl">DATA</span><span class="val">${formatarDataBR(v(f.data))}</span></div>
          <div class="cell"><span class="lbl">RECLASSIFICAÇÃO</span><span class="val">${reclassificacaoStr}</span></div>
        </div>
        <div class="grid-box" style="grid-template-columns: 1fr 1.5fr 1fr 1fr;">
          <div class="cell"><span class="lbl">MÉDICO REGULADOR INICIAL</span><span class="val">${v(f.regulador)}</span></div>
          <div class="cell"><span class="lbl">MOTIVO ACIONAMENTO</span><span class="val">${v(f.motivo_acionamento)}</span></div>
          <div class="cell"><span class="lbl">TÉC. DE ENFERMAGEM</span><span class="val">${v(f.tec_enfermeiro)}</span></div>
          <div class="cell"><span class="lbl">SOCORRISTA (CONDUTOR)</span><span class="val">${v(f.socorrista)}</span></div>
        </div>
        <div class="grid-box" style="grid-template-columns: repeat(7, 1fr);">
          <div class="cell"><span class="lbl">J9 (SAÍDA BASE)</span><span class="val">${v(f.hora_j9)}</span></div>
          <div class="cell"><span class="lbl">J10 (CHEG. LOCAL)</span><span class="val">${v(f.hora_j10)}</span></div>
          <div class="cell"><span class="lbl">QTA (CANCELADO)</span><span class="val">${v(f.hora_qta)}</span></div>
          <div class="cell"><span class="lbl">J9-INT (SAÍDA LOCAL)</span><span class="val">${v(f.hora_j9_int)}</span></div>
          <div class="cell"><span class="lbl">J10-INT (DESTINO)</span><span class="val">${v(f.hora_j10_int)}</span></div>
          <div class="cell"><span class="lbl">J11 (DISPONÍVEL)</span><span class="val">${v(f.hora_j11)}</span></div>
          <div class="cell"><span class="lbl">J12 (NA BASE)</span><span class="val">${v(f.hora_j12)}</span></div>
        </div>

        <!-- 2. PACIENTE -->
        <div class="sec-title">2. IDENTIFICAÇÃO DO PACIENTE & LOCAL</div>
        <div class="grid-box" style="grid-template-columns: 2fr 1fr 1fr 1fr;">
          <div class="cell"><span class="lbl">NOME COMPLETO DO PACIENTE</span><span class="val">${v(f.paciente)}</span></div>
          <div class="cell"><span class="lbl">CPF PACIENTE</span><span class="val">${v(f.cpf_paciente)}</span></div>
          <div class="cell"><span class="lbl">DATA NASC.</span><span class="val">${formatarDataBR(v(f.data_nascimento))}</span></div>
          <div class="cell"><span class="lbl">IDADE / SEXO</span><span class="val">${v(f.idade)} anos | ${sexoFmt}</span></div>
        </div>
        <div class="grid-box" style="grid-template-columns: 2fr 1fr 1fr 1fr;">
          <div class="cell"><span class="lbl">RUA / LOGRADOURO</span><span class="val">${v(f.rua)}</span></div>
          <div class="cell"><span class="lbl">Nº / APTO</span><span class="val">${v(f.numero)}</span></div>
          <div class="cell"><span class="lbl">BAIRRO</span><span class="val">${v(f.bairro)}</span></div>
          <div class="cell"><span class="lbl">MUNICÍPIO / UF</span><span class="val">${v(f.municipio, 'ORLEANS')} / ${v(f.estado, 'SC')}</span></div>
        </div>

        <!-- 3. TIPO OCORRÊNCIA -->
        <div class="sec-title">3. TIPO OCORRÊNCIA</div>
        <div class="grid-box" style="grid-template-columns: 1fr;">
          <div class="cell"><span class="lbl">NATUREZA DO ATENDIMENTO</span><span class="val">${v(f.tipo_ocorrencia)}</span></div>
        </div>

        <!-- 4. ABCDE E EXAME FÍSICO -->
        <div class="sec-title">4. AVALIAÇÃO TÁTICA & EXAME FÍSICO (ABCDE)</div>
        <div class="grid-box" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
          <div class="cell"><span class="lbl">A - VIAS AÉREAS</span><span class="val">${v(f.vias_aereas)}</span></div>
          <div class="cell"><span class="lbl">B - RESPIRAÇÃO</span><span class="val">${v(f.respiracao)}</span></div>
          <div class="cell"><span class="lbl">C - PULSO / PELE</span><span class="val">${v(f.circulacao)}</span></div>
          <div class="cell"><span class="lbl">D - GLASGOW TOTAL</span><span class="val">${gTot !== '—' ? gTot + '/15' : '—'} (O:${gOc} V:${gVerb} M:${gMot})</span></div>
        </div>

        <!-- TABELA DE LESÕES POR REGIÃO -->
        ${(v(f.tipo_ocorrencia).includes('Trânsito') || v(f.tipo_ocorrencia).includes('Trauma')) ? formatarLesoesGrid(f.lesoes_exposicao) : ''}

        <!-- BIOSSEGURANÇA -->
        <div class="grid-box" style="grid-template-columns: 1fr 1.5fr 1.5fr;">
          <div class="cell"><span class="lbl">BIOSSEGURANÇA SUSPEITA?</span><span class="val">${v(f.bio_suspeita)}</span></div>
          <div class="cell"><span class="lbl">TIPO DE AGENTE / SUSPEITA</span><span class="val">${v(f.bio_tipo_agente)}</span></div>
          <div class="cell"><span class="lbl">DESINFECÇÃO VIATURA</span><span class="val">${v(f.bio_desinfeccao)}</span></div>
        </div>

        <!-- 5. SINAIS VITAIS -->
        <div class="sec-title">5. SINAIS VITAIS (MEDIÇÕES APH)</div>
        <table class="tbl-ficha">
          <thead>
            <tr>
              <th>HORA</th>
              <th>PA (MMHG)</th>
              <th>FC (BPM)</th>
              <th>FR (MPM)</th>
              <th>SPO2 (%)</th>
              <th>TEMP (°C)</th>
              <th>HGT (MG/DL)</th>
              <th>PUPILAS</th>
            </tr>
          </thead>
          <tbody>
            ${svRowsHtml}
          </tbody>
        </table>

        <!-- 6. INSUMOS E PSICOTRÓPICOS -->
        <div class="sec-title">6. MEDICAÇÕES & INSUMOS UTILIZADOS</div>
        <div class="grid-box" style="grid-template-columns: 1fr;">
          <div class="cell"><span class="val" style="font-weight: normal; font-size: 9px;">${insumosHtml}</span></div>
        </div>

        <!-- 7. ANAMNESE E EVOLUÇÃO -->
        <div class="sec-title">7. ANAMNESE, EVOLUÇÃO E CONDUTA</div>
        <div class="grid-box" style="grid-template-columns: 1fr 1fr;">
          <div class="cell"><span class="lbl">ALERGIAS?</span><span class="val">${v(f.alergia_select)} ${v(f.alergia_desc) !== '—' ? '(' + f.alergia_desc + ')' : ''}</span></div>
          <div class="cell"><span class="lbl">MEDICAÇÃO CONTÍNUA?</span><span class="val">${v(f.med_continua_select)} ${v(f.med_continua_desc) !== '—' ? '(' + f.med_continua_desc + ')' : ''}</span></div>
        </div>
        <div class="grid-box" style="grid-template-columns: 1fr;">
          <div class="cell" style="min-height: 45px;">
            <span class="lbl">EVOLUÇÃO E CONDUTA</span>
            <span class="val" style="font-weight: normal; font-size: 9px; white-space: pre-wrap;">${v(f.evolucao_texto)}</span>
          </div>
        </div>

        <!-- 8. DESFECHO E RECUSA -->
        <div class="sec-title">8. DESFECHO DO ATENDIMENTO & RECUSA / ASSINATURA</div>
        <div class="grid-box" style="grid-template-columns: 1.5fr 1.5fr 1fr;">
          <div class="cell"><span class="lbl">DESFECHO DA VÍTIMA</span><span class="val">${v(f.desfecho_vitima)}</span></div>
          <div class="cell"><span class="lbl">HOSPITAL RECEPTOR</span><span class="val">${v(f.hospital_destino)}</span></div>
          <div class="cell"><span class="lbl">HOUVE RECUSA?</span><span class="val">${v(f.houve_recusa)}</span></div>
        </div>

        ${v(f.houve_recusa) === 'SIM' ? `
          <div class="grid-box" style="grid-template-columns: 1fr 2fr 1fr;">
            <div class="cell"><span class="lbl">TIPO ASSINANTE</span><span class="val">${v(f.tipo_assinante)}</span></div>
            <div class="cell"><span class="lbl">NOME ASSINANTE</span><span class="val">${v(f.nome_assinante)}</span></div>
            <div class="cell"><span class="lbl">CPF ASSINANTE</span><span class="val">${v(f.cpf_assinante)}</span></div>
          </div>
        ` : ''}

        <!-- BLOCO DE ASSINATURAS -->
        <div style="margin-top: 25px; display: flex; justify-content: space-around; text-align: center;">
          <div>
            _______________________________________<br>
            <b>${v(f.socorrista, 'SOCORRISTA (CONDUTOR)')}</b><br>
            <span style="font-size: 8px;">Assinatura e Carimbo</span>
          </div>
          <div>
            _______________________________________<br>
            <b>${v(f.tec_enfermeiro, 'TÉCNICO DE ENFERMAGEM')}</b><br>
            <span style="font-size: 8px;">Assinatura e Carimbo / COREN</span>
          </div>
          <div>
            _______________________________________<br>
            <b>MÉDICO RECEPTOR / REGULADOR</b><br>
            <span style="font-size: 8px;">Assinatura e Carimbo / CRM</span>
          </div>
        </div>
      `;

      document.getElementById('conteudoFichaDetalhada').innerHTML = htmlOficial;
      document.querySelector('.tbl-lista').style.display = 'none';
      document.querySelector('.busca-box').style.display = 'none';
      document.getElementById('areaFichaImpressao').style.display = 'block';
    }

    function fecharFichaImpressao() {
      document.getElementById('areaFichaImpressao').style.display = 'none';
      document.querySelector('.tbl-lista').style.display = 'table';
      document.querySelector('.busca-box').style.display = 'flex';
    }
  </script>
</body>
</html>
