<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMU Connect — Acesso ao Portal</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --samu-red: #d32f2f;
      --samu-navy: #0d233a;
      --samu-blue: #1976d2;
      --bg-surface: #f4f7fa;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --border: #cbd5e1;
      --shadow: 0 10px 30px rgba(13, 35, 58, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg-surface); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    .login-card {
      width: 100%; max-width: 420px; background: var(--card-bg); border-radius: 20px;
      box-shadow: var(--shadow); border-top: 6px solid var(--samu-red); padding: 35px 28px; text-align: center;
    }

    .login-header img { width: 80px; margin-bottom: 15px; }
    .login-header h1 { font-size: 1.3rem; color: var(--samu-navy); font-weight: 800; text-transform: uppercase; }
    .login-header p { font-size: 0.82rem; color: #64748b; margin-top: 4px; margin-bottom: 25px; }

    .form-group { display: flex; flex-direction: column; text-align: left; margin-bottom: 18px; }
    .form-group label { font-size: 0.78rem; font-weight: 700; color: var(--samu-navy); margin-bottom: 6px; text-transform: uppercase; }
    .form-group input { padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 0.9rem; outline: none; background: #f8fafc; }
    .form-group input:focus { border-color: var(--samu-blue); background: white; }

    .forgot-link { text-align: right; margin-top: -10px; margin-bottom: 20px; }
    .forgot-link a { font-size: 0.8rem; color: var(--samu-blue); font-weight: 600; text-decoration: none; }
    .forgot-link a:hover { text-decoration: underline; }

    .btn-login { width: 100%; background: var(--samu-navy); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
    .btn-login:hover { background: #081726; }

    /* MODAL DE ESQUECI A SENHA */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 35, 58, 0.6); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal-content { background: white; width: 90%; max-width: 400px; padding: 25px; border-radius: 16px; box-shadow: var(--shadow); text-align: left; }
    .modal-content h3 { font-size: 1.1rem; color: var(--samu-navy); margin-bottom: 8px; }
    .modal-content p { font-size: 0.82rem; color: #64748b; margin-bottom: 18px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    .btn-secondary { background: #e2e8f0; color: #334155; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-primary { background: var(--samu-red); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <img src="logo.png" alt="SAMU 192" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/2/23/SAMU_192.svg'">
      <h1>SAMU CONNECT</h1>
      <p>Portal de Acesso Operacional & Gestão</p>
    </div>

    <form id="formLogin" onsubmit="autenticarUsuario(event)">
      <div class="form-group">
        <label>E-mail ou CPF:*</label>
        <input type="text" id="login_usuario" placeholder="Digite seu e-mail cadastrado..." required>
      </div>

      <div class="form-group">
        <label>Senha de Acesso:*</label>
        <input type="password" id="login_senha" placeholder="••••••••" required>
      </div>

      <div class="forgot-link">
        <a href="#" onclick="abrirModalEsqueciSenha(event)">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn-login">Entrar no Portal ➔</button>
    </form>
  </div>

  <!-- MODAL: ESQUECI MINHA SENHA -->
  <div class="modal-overlay" id="modalEsqueciSenha">
    <div class="modal-content">
      <h3>🔑 Recuperação de Senha</h3>
      <p>Informe o seu e-mail cadastrado no sistema para receber as instruções de redefinição de senha.</p>

      <form id="formRecuperacao" onsubmit="enviarRecuperacaoSenha(event)">
        <div class="form-group">
          <label>E-mail Cadastrado:*</label>
          <input type="email" id="recup_email" placeholder="seu.email@orleans.sc.gov.br" required>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="fecharModalEsqueciSenha()">Cancelar</button>
          <button type="submit" class="btn-primary">Enviar Link 📩</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const dbNuvem = supabase.createClient(
      "https://rcpgukslnlfptreiusff.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJjcGd1a3NsbmxmcHRyZWl1c2ZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMDQ2MTYsImV4cCI6MjEwMjU4MDYxNn0.LgadTI7PwlLMBT5TbNkMncI0OfL22wjGAU_xanR4J6A"
    );

    function abrirModalEsqueciSenha(e) {
      if (e) e.preventDefault();
      document.getElementById('modalEsqueciSenha').classList.add('active');
    }

    function fecharModalEsqueciSenha() {
      document.getElementById('modalEsqueciSenha').classList.remove('active');
    }

    async function autenticarUsuario(e) {
      e.preventDefault();
      const user = document.getElementById('login_usuario').value.trim();
      const pass = document.getElementById('login_senha').value.trim();

      // Autenticação Supabase
      const { data, error } = await dbNuvem.auth.signInWithPassword({
        email: user,
        password: pass,
      });

      if (!error && data.user) {
        window.location.href = 'portal.html';
      } else {
        alert("⚠️ Usuário ou senha incorretos. Verifique suas credenciais.");
      }
    }

    async function enviarRecuperacaoSenha(e) {
      e.preventDefault();
      const emailInput = document.getElementById('recup_email').value.trim();

      const { error } = await dbNuvem.auth.resetPasswordForEmail(emailInput, {
        redirectTo: window.location.origin + '/redefinir-senha.html',
      });

      if (!error) {
        await registrarLog('Segurança / Login', 'Solicitação de Senha', `Solicitada redefinição de senha para o e-mail: ${emailInput}`);
        alert(`✅ Instruções enviadas para ${emailInput}!\nVerifique sua caixa de entrada ou spam.`);
        fecharModalEsqueciSenha();
      } else {
        alert("Erro ao solicitar redefinição: " + error.message);
      }
    }

    async function registrarLog(sistema, acao, detalhes) {
      try {
        await dbNuvem.from('logs_alteracoes').insert([{
          sistema: sistema,
          usuario_nome: document.getElementById('recup_email').value || 'Usuário Anônimo',
          acao: acao,
          detalhes: detalhes
        }]);
      } catch (err) { console.error(err); }
    }
  </script>
</body>
</html>
